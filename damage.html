window.addEventListener('load',function(){localLoad();buildItems();periodAnchor.value=anaAnchor.value=ymd(new Date());GA.cloud.mount('#ga-cloud');setLang(localStorage.getItem('ga_damage_lang')||GA.lang||'zh');resetForm();translateControls();renderPeriodNav('record');renderPeriodNav('analysis');setRecordView(recordView);renderAll();if(window.GAAutoSync)GAAutoSync.install({key:'damage',pull:cloudDown,push:cloudUp,canSync:function(){return !!(GA.gasUrl&&GA.gasUrl());},startDelay:150,anchor:'#ga-cloud'});refreshWorkflow()});
</script></body></html>
