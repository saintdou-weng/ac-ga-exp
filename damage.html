</head><body><div class="wrap">
<div class="hero"><div><h1 id="title">⚠️ 損壞／遺失財物報告</h1><small>VRT Damage / Lost Property · GA-EXP v3.9.4b</small></div><div class="grow"></div><div class="cloudRow"><span id="ga-cloud" class="ga-cloud idle"></span><button class="btn" onclick="cloudUp()">☁↑</button><button class="btn" onclick="cloudDown()">☁↓</button></div><div class="lang"><button data-l="zh" onclick="setLang('zh')" class="on">中文</button><button data-l="en" onclick="setLang('en')">EN</button><button data-l="km" onclick="setLang('km')">ខ្មែរ</button></div><a class="btn" href="index.html">← GA-EXP</a></div>
<div class="tabs"><button class="on" data-p="dash" onclick="tab('dash',this)">📊 <span data-t="dash">儀表板</span></button><button data-p="form" onclick="newReport();tab('form',this)">➕ <span data-t="new">新增</span></button><button data-p="records" onclick="tab('records',this)">📋 <span data-t="records">記錄</span></button><button data-p="analysis" onclick="tab('analysis',this)">📈 <span data-t="analysis">分析</span></button></div>
<section id="p-dash" class="pane on"><div class="kpis" id="kpis"></div><div class="card"><div class="bar"><b data-t="recent">最近記錄</b><div class="grow"></div><button class="btn" onclick="openSummary()">✈️ <span data-t="summary">摘要</span></button></div><div class="tablewrap"><table><thead id="dashHead"></thead><tbody id="dashBody"></tbody></table></div></div></section>
<section id="p-form" class="pane"><div class="card"><div class="bar"><b id="formTitle">➕ 新增 Damage Report</b><div class="grow"></div><span class="mini" id="rid"></span></div><div class="formgrid">
<div class="field"><label data-t="date">日期</label><input type="date" id="f-date"></div><div class="field"><label data-t="name">姓名</label><input id="f-name"></div><div class="field"><label data-t="dept">部門</label><input id="f-dept"></div><div class="field"><label>ID</label><input id="f-emp"></div>
<div class="field"><label data-t="type">類型</label><select id="f-type"><option value="damage">Damage 損壞</option><option value="lost">Lost 遺失</option></select></div><div class="field"><label data-t="location">地點</label><input id="f-loc"></div><div class="field"><label data-t="incidentDate">發生／遺失日期</label><input type="date" id="f-incdate"></div><div class="field"><label data-t="cost">估計損失金額 USD</label><input type="number" min="0" step="0.01" id="f-cost"></div>
<div class="field w4"><label data-t="items">物品</label><div class="items" id="itemGrid"></div><div class="bar"><input id="f-other" placeholder="Other / 其他 / ផ្សេងៗ" style="flex:1;border:1px solid #cbd5e1;border-radius:6px;padding:7px"></div></div>
<div class="field w2"><label data-t="desc">描述</label><textarea id="f-desc" rows="3"></textarea></div><div class="field w2"><label data-t="explain">原因／說明</label><textarea id="f-expl" rows="3"></textarea></div>
<div class="field w4"><label data-t="action">處理／改善措施</label><textarea id="f-action" rows="2"></textarea></div>
<div class="field w4"><label>📷 <span data-t="photo">照片／拍照證據</span></label><div class="bar"><button class="btn" onclick="document.getElementById('filePhoto').click()">🖼️ <span data-t="uploadPhoto">選照片</span></button><button class="btn" onclick="document.getElementById('camPhoto').click()">📷 <span data-t="camera">拍照</span></button><span class="mini" data-t="photoHint">最多 10 張；儲存時同步 Drive</span></div><input id="filePhoto" type="file" accept="image/*" multiple hidden onchange="addPhotos(this.files)"><input id="camPhoto" type="file" accept="image/*" capture="environment" hidden onchange="addPhotos(this.files)"><div id="photoRow" class="photoRow"></div></div>
</div><div class="bar"><button class="btn p" onclick="saveReport(false)">💾 <span data-t="save">儲存</span></button><button class="btn ok" id="btnSaveSubmit" onclick="saveReport(true)">📋 <span data-t="saveSubmit">儲存並送 Phea Review</span></button><button class="btn" onclick="resetForm()">↺ <span data-t="clear">清除</span></button><div class="grow"></div><span class="mini" data-t="workflow">流程：建立 → Phea Review → Paul Approval</span></div></div></section>
<section id="p-records" class="pane"><div class="card"><div class="filters"><div class="period"><button data-pt="day" onclick="setPeriod('day')">D</button><button data-pt="week" onclick="setPeriod('week')">W</button><button data-pt="month" class="on" onclick="setPeriod('month')">M</button><button data-pt="year" onclick="setPeriod('year')">Y</button></div><button class="btn" onclick="shiftPeriod(-1)">◀</button><input id="periodAnchor" type="date" onchange="renderAll()"><button class="btn" onclick="shiftPeriod(1)">▶</button><select id="ftype" onchange="renderRecords()"><option value="">All Type</option><option value="damage">Damage</option><option value="lost">Lost</option></select><select id="fstatus" onchange="renderRecords()"><option value="">All Status</option><option value="draft">Draft</option><option value="pending_review">Pending Review</option><option value="reviewed">Reviewed</option><option value="approved">Approved</option><option value="returned">Returned</option><option value="rejected">Rejected</option></select><input id="q" placeholder="Search" oninput="renderRecords()"><div class="grow"></div><button class="btn" onclick="openSummary()">✈️ <span data-t="summary">摘要</span></button><button class="btn ok" onclick="submitSelected()">📋 <span data-t="submit">送 Phea Review</span></button><button class="btn" onclick="document.getElementById('imp').click()">⬆ <span data-t="import">匯入</span></button><input id="imp" type="file" accept=".xlsx,.xls,.csv,.json" hidden onchange="importFile(this.files[0])"><button class="btn" onclick="exportXlsx()">⬇ Excel</button></div><div class="tablewrap"><table><thead id="recHead"></thead><tbody id="recBody"></tbody></table></div></div></section>
<section id="p-analysis" class="pane"><div class="card"><div class="filters"><div class="period"><button data-ap="day" onclick="setAna('day')">D</button><button data-ap="week" onclick="setAna('week')">W</button><button data-ap="month" class="on" onclick="setAna('month')">M</button><button data-ap="year" onclick="setAna('year')">Y</button></div><button class="btn" onclick="shiftAna(-1)">◀</button><input id="anaAnchor" type="date" onchange="renderAnalysis()"><button class="btn" onclick="shiftAna(1)">▶</button></div><div class="kpis" id="akpis"></div><div class="chart" id="chart"></div></div><div class="card"><b data-t="top">常見損壞／遺失物品</b><div id="topItems" class="bar"></div></div></section>
</div>
<div class="modal" id="detail"><div class="box"><div class="mh"><b id="detailTitle"></b><div class="grow"></div><button class="btn" onclick="closeDetail()">✕</button></div><div class="mb" id="detailBody"></div></div></div>
<script>

var I={zh:{title:'⚠️ 損壞／遺失財物報告',dash:'儀表板',new:'新增',records:'記錄',analysis:'分析',recent:'最近記錄',summary:'摘要',date:'日期',name:'姓名',dept:'部門',type:'類型',location:'地點',incidentDate:'發生／遺失日期',cost:'估計損失金額 USD',items:'物品',desc:'描述',explain:'原因／說明',action:'處理／改善措施',photo:'照片／拍照證據',uploadPhoto:'選照片',camera:'拍照',photoHint:'最多 10 張；儲存時同步 Drive',save:'儲存',saveSubmit:'儲存並送 Phea Review',sendReview:'送 Phea Review',waitingPhea:'等待 Phea Review',waitingPaul:'等待 Paul 核可',clear:'清除',workflow:'流程：建立 → Phea Review → Paul Approval',submit:'送 Phea Review',import:'匯入',top:'常見損壞／遺失物品',total:'總報告',damage:'損壞',lost:'遺失',pending:'待 Review',reviewed:'Phea 已 Review',approved:'Paul 已核可',amount:'損失金額'},en:{title:'⚠️ Damage / Lost Property Report',dash:'Dashboard',new:'New',records:'Records',analysis:'Analysis',recent:'Recent records',summary:'Summary',date:'Date',name:'Name',dept:'Department',type:'Type',location:'Location',incidentDate:'Incident / lost date',cost:'Estimated loss USD',items:'Items',desc:'Description',explain:'Cause / explanation',action:'Action / improvement',photo:'Photo / camera evidence',uploadPhoto:'Choose photos',camera:'Camera',photoHint:'Max 10; sync to Drive on save',save:'Save',saveSubmit:'Save & Send to Phea Review',sendReview:'Send to Phea Review',waitingPhea:'Waiting for Phea Review',waitingPaul:'Waiting for Paul Approval',clear:'Clear',workflow:'Flow: Create → Phea Review → Paul Approval',submit:'Send to Phea Review',import:'Import',top:'Top damaged / lost items',total:'Total reports',damage:'Damage',lost:'Lost',pending:'Pending review',reviewed:'Reviewed by Phea',approved:'Approved by Paul',amount:'Loss amount'},km:{title:'⚠️ របាយការណ៍ខូចខាត / បាត់បង់ទ្រព្យ',dash:'ផ្ទាំងគ្រប់គ្រង',new:'បន្ថែម',records:'កំណត់ត្រា',analysis:'វិភាគ',recent:'កំណត់ត្រាថ្មីៗ',summary:'សង្ខេប',date:'កាលបរិច្ឆេទ',name:'ឈ្មោះ',dept:'ផ្នែក',type:'ប្រភេទ',location:'ទីតាំង',incidentDate:'កាលបរិច្ឆេទកើតហេតុ / បាត់',cost:'តម្លៃខូចខាតប៉ាន់ស្មាន USD',items:'ទ្រព្យ',desc:'ការពិពណ៌នា',explain:'មូលហេតុ / ពន្យល់',action:'វិធានការ / កែលម្អ',photo:'រូបថត / ថតរូបជាភស្តុតាង',uploadPhoto:'ជ្រើសរូប',camera:'ថតរូប',photoHint:'អតិបរមា 10; រក្សាទុកទៅ Drive',save:'រក្សាទុក',saveSubmit:'រក្សាទុក និងផ្ញើឱ្យ Phea ពិនិត្យ',sendReview:'ផ្ញើឱ្យ Phea ពិនិត្យ',waitingPhea:'រង់ចាំ Phea ពិនិត្យ',waitingPaul:'រង់ចាំ Paul អនុម័ត',clear:'សម្អាត',workflow:'លំហូរ៖ បង្កើត → Phea ពិនិត្យ → Paul អនុម័ត',submit:'ផ្ញើទៅ Phea ពិនិត្យ',import:'នាំចូល',top:'ទ្រព្យខូច / បាត់ញឹកញាប់',total:'របាយការណ៍សរុប',damage:'ខូចខាត',lost:'បាត់',pending:'រង់ចាំ Phea',reviewed:'Phea បានពិនិត្យ',approved:'Paul បានអនុម័ត',amount:'តម្លៃខូចខាត'}};
function T(k){return (I[lang]&&I[lang][k])||I.zh[k]||k}function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function setLang(l){lang=l;localStorage.setItem('ga_damage_lang',l);document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));document.getElementById('title').textContent=T('title');renderAll()}
function tab(p,b){document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.p===p));if(p==='analysis')renderAnalysis();if(p==='records')renderRecords();if(p==='dash')renderDash()}
function localSave(){localStorage.setItem('ga_damage_records_v1',JSON.stringify(DB));}function localLoad(){try{DB=JSON.parse(localStorage.getItem('ga_damage_records_v1')||'[]');if(!Array.isArray(DB))DB=[]}catch(e){DB=[]}}
function buildItems(){itemGrid.innerHTML=ITEMS.map((x,i)=>'<label class="it"><input type="checkbox" value="'+esc(x[0])+'"> <span>'+esc(x[0])+'<span class="mini"> / '+esc(x[1])+'</span></span></label>').join('')}
function ymd(d){return d.toISOString().slice(0,10)}function idNew(){var d=new Date();return 'DMG-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function newReport(){editingId='';resetForm();rid.textContent=''}function resetForm(){['f-name','f-dept','f-emp','f-loc','f-other','f-desc','f-expl','f-action','f-cost','f-incdate'].forEach(id=>document.getElementById(id).value='');document.getElementById('f-date').value=ymd(new Date());document.getElementById('f-type').value='damage';document.querySelectorAll('#itemGrid input').forEach(x=>x.checked=false);pendingPhotos=[];renderPhotos()}
function resizeFile(f){return new Promise((res,rej)=>{var r=new FileReader();r.onload=e=>{var im=new Image();im.onload=()=>{var m=1500,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({name:f.name||'photo.jpg',mime:'image/jpeg',data:c.toDataURL('image/jpeg',.78)})};im.onerror=rej;im.src=e.target.result};r.onerror=rej;r.readAsDataURL(f)})}
async function addPhotos(files){for(const f of Array.from(files||[])){if(pendingPhotos.length>=10)break;try{pendingPhotos.push(await resizeFile(f))}catch(e){}}renderPhotos();filePhoto.value='';camPhoto.value=''}
function renderPhotos(){photoRow.innerHTML=pendingPhotos.map((p,i)=>'<div class="ph"><img src="'+esc(p.previewUrl||p.data||'')+'"><button onclick="pendingPhotos.splice('+i+',1);renderPhotos()">×</button></div>').join('')}
async function uploadPhoto(p,recordId,i){if(p.fileId||!p.data)return p;if(!GA.gasUrl())return p;var raw=p.data.split(',')[1]||'';var r=await GA.gasPost('damageAttachment',{recordId:recordId,fileName:p.name||('photo_'+(i+1)+'.jpg'),mimeType:p.mime||'image/jpeg',data:raw});return (r.data||r)}
async function saveReport(submitAfter){
  var name=document.getElementById('f-name').value.trim(),date=document.getElementById('f-date').value,items=Array.from(document.querySelectorAll('#itemGrid input:checked')).map(x=>x.value),other=document.getElementById('f-other').value.trim();
  if(!name||!date||(!items.length&&!other)){GA.toast(lang==='en'?'Name, date and item are required':lang==='km'?'ត្រូវបំពេញឈ្មោះ កាលបរិច្ឆេទ និងទ្រព្យ':'姓名、日期、物品為必填','err');return}

function periodRange(type,anchor){var d=new Date((anchor||ymd(new Date()))+'T12:00:00'),s=new Date(d),e=new Date(d);if(type==='day'){}else if(type==='week'){var wd=(d.getDay()+6)%7;s.setDate(d.getDate()-wd);e=new Date(s);e.setDate(s.getDate()+6)}else if(type==='month'){s=new Date(d.getFullYear(),d.getMonth(),1,12);e=new Date(d.getFullYear(),d.getMonth()+1,0,12)}else{s=new Date(d.getFullYear(),0,1,12);e=new Date(d.getFullYear(),11,31,12)}return [ymd(s),ymd(e)]}

function renderAnalysis(){var arr=filterPeriod(DB,anaType,anaAnchor.value);akpis.innerHTML=kpiHtml(arr);var bins=[];if(anaType==='day'){bins=[[anaAnchor.value,arr]]}else if(anaType==='week'){var rg=periodRange('week',anaAnchor.value);for(var d=new Date(rg[0]+'T12:00:00');ymd(d)<=rg[1];d.setDate(d.getDate()+1)){var k=ymd(d);bins.push([k.slice(5),DB.filter(r=>r.date===k)])}}else if(anaType==='month'){var a=new Date(anaAnchor.value+'T12:00:00'),days=new Date(a.getFullYear(),a.getMonth()+1,0).getDate();for(let i=1;i<=days;i++){var k=a.getFullYear()+'-'+String(a.getMonth()+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');bins.push([String(i),DB.filter(r=>r.date===k)])}}else{var a=new Date(anaAnchor.value+'T12:00:00');for(let m=0;m<12;m++){var px=a.getFullYear()+'-'+String(m+1).padStart(2,'0');bins.push([String(m+1),DB.filter(r=>r.date.startsWith(px))])}}var mx=Math.max(1,...bins.map(x=>x[1].length));chart.innerHTML=bins.map(x=>{var d=x[1].filter(r=>r.type==='damage').length,l=x[1].filter(r=>r.type==='lost').length;return '<div class="col"><div class="bars"><div class="bd" title="Damage '+d+'" style="height:'+(d/mx*135)+'px"></div><div class="bl" title="Lost '+l+'" style="height:'+(l/mx*135)+'px"></div></div><div class="mini">'+esc(x[0])+'</div></div>'}).join('');var f={};arr.forEach(r=>(r.items||[]).forEach(x=>f[x]=(f[x]||0)+1));topItems.innerHTML=Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>'<span class="badge reviewed">'+esc(x[0])+' · '+x[1]+'</span>').join('')||'—'}
function damageStamp(r){var v=r&&(r.updatedAt||r.createdAt||r.submittedAt||r.reviewedAt||r.approvedAt),n=v?new Date(v).getTime():0;return isNaN(n)?0:n}function damageMerge(localRows,cloudRows){var map={},order=[];(localRows||[]).forEach(function(r){var k=String(r&&r.id||'');if(!k)return;if(!map[k])order.push(k);map[k]=r});(cloudRows||[]).forEach(function(r){var k=String(r&&r.id||'');if(!k)return;var old=map[k];if(!old){map[k]=r;order.push(k);return}var os=damageStamp(old),cs=damageStamp(r);map[k]=cs>os?r:(os>cs?old:Object.assign({},r,old))});return order.map(function(k){return map[k]})}
async function cloudUp(opts){opts=opts||{};if(!GA.gasUrl())return false;try{var r=await GA.cloud.upload('damage',{records:DB});if(r&&r.code==='CONFLICT'){await cloudDown({silent:true});r=await GA.cloud.upload('damage',{records:DB},{force:true})}if(!opts.silent)GA.toast('☁↑ OK');return true}catch(e){if(!opts.silent)GA.toast(e.message,'err');return false}}
