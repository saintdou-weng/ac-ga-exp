<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC-GA-EXP · Expense Center 費用中心</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="shared/ga.css" onerror="this.onerror=null;this.href='https://saintdou-weng.github.io/ac-ga-exp/shared/ga.css'">
<script src="shared/ga-core.js"></script>
<script src="shared/ga-import.js"></script>
<script src="shared/ga-telegram.js"></script>
<script src="shared/exp-seed.js"></script>
<script>/* GA is not defined fallback：單獨開檔時自動從 GitHub 補載 shared/ */
if(typeof GA==="undefined"){document.write('<scr'+'ipt src="https://saintdou-weng.github.io/ac-ga-exp/shared/ga-core.js"></scr'+'ipt>');document.write('<scr'+'ipt src="https://saintdou-weng.github.io/ac-ga-exp/shared/ga-import.js"></scr'+'ipt>');document.write('<scr'+'ipt src="https://saintdou-weng.github.io/ac-ga-exp/shared/ga-telegram.js"></scr'+'ipt>');document.write('<scr'+'ipt src="https://saintdou-weng.github.io/ac-ga-exp/shared/exp-seed.js"></scr'+'ipt>');}
</script>

<style>
  .exp-wrap{max-width:1180px;margin:0 auto;padding:12px}
  .exp-nav{display:flex;gap:4px;background:#fff;border:1px solid var(--ga-line);border-radius:11px;
    padding:5px;margin:11px 0;box-shadow:var(--ga-sh);overflow-x:auto}
  .exp-tab{border:0;background:transparent;border-radius:8px;padding:9px 15px;font-size:13px;
    font-weight:600;color:var(--ga-txt2);cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
  .exp-tab.on{background:var(--ga-sky);color:#fff}
  .exp-tab:not(.on):hover{background:var(--ga-sky-l);color:var(--ga-sky)}
  .exp-pane{display:none}.exp-pane.on{display:block}
  .exp-sec{background:#fff;border:1px solid var(--ga-line);border-radius:12px;padding:14px;
    margin-bottom:11px;box-shadow:var(--ga-sh)}
  .exp-sec-t{font-size:12px;font-weight:700;color:var(--ga-txt2);margin-bottom:11px;
    display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .exp-sec-t .sp{margin-left:auto;font-size:11px;color:var(--ga-mut);font-family:var(--ga-mono);font-weight:400}
  .exp-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
  .exp-filters select,.exp-filters input{border:1px solid var(--ga-line);border-radius:8px;padding:7px 10px;
    font-size:12px;font-family:inherit;background:#fff;outline:none}
  .exp-filters select:focus,.exp-filters input:focus{border-color:var(--ga-sky)}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:11px}
  .form-grid label{display:block;font-size:10px;font-weight:700;color:var(--ga-mut);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .form-grid input,.form-grid select{width:100%;border:1px solid var(--ga-line);border-radius:8px;
    padding:8px 10px;font-size:13px;font-family:inherit;outline:none}
  .form-grid input:focus,.form-grid select:focus{border-color:var(--ga-sky)}
  .diff-pos{color:var(--ga-bad)}.diff-neg{color:var(--ga-ok)}
</style>
</head>
<body>

<div id="ga-header"></div>

<div class="exp-wrap">
  <div id="exp-period"></div>

  <div class="exp-nav">
    <button class="exp-tab on" data-p="ov"    onclick="expTab('ov')">📊 <span data-t="tabOv">總覽</span></button>
    <button class="exp-tab"    data-p="ledger" onclick="expTab('ledger')">📒 <span data-t="tabLedger">明細帳</span></button>
    <button class="exp-tab"    data-p="cat"   onclick="expTab('cat')">📁 <span data-t="tabCat">分類分析</span></button>
    <button class="exp-tab"    data-p="trend" onclick="expTab('trend')">📈 <span data-t="tabTrend">趨勢</span></button>
    <button class="exp-tab"    data-p="bgt"   onclick="expTab('bgt')">💰 <span data-t="tabBgt">預算差異</span></button>
    <button class="exp-tab"    data-p="add"   onclick="expTab('add')">➕ <span data-t="tabAdd">新增費用</span></button>
  </div>

  <!-- 總覽 -->
  <div class="exp-pane on" id="pane-ov">
    <div class="ga-kpis" id="exp-kpis" style="margin-bottom:11px"></div>
    <div class="ga-charts">
      <div class="ga-chart"><div class="ga-chart-t" data-t="chCat">分類占比</div><div class="ga-chart-box"><canvas id="ch-cat"></canvas></div></div>
      <div class="ga-chart"><div class="ga-chart-t" data-t="chSrc">來源模組</div><div class="ga-chart-box"><canvas id="ch-src"></canvas></div></div>
    </div>
    <div class="exp-sec" style="margin-top:11px">
      <div class="exp-sec-t">🏆 <span data-t="topSpend">主要支出 Top</span><span class="sp" id="ov-count"></span></div>
      <div id="ov-top"></div>
    </div>
  </div>

  <!-- 明細帳 -->
  <div class="exp-pane" id="pane-ledger">
    <div class="exp-sec">
      <div class="exp-filters">
        <select id="fl-cat"><option value="">— 全部類別 —</option></select>
        <select id="fl-src">
          <option value="" data-t-opt="allSrc">— 全部來源 —</option>
          <option value="manual">✍️ Manual</option><option value="excel">📥 Excel</option>
          <option value="seed">🗂️ Historical</option><option value="po">📋 PO</option>
          <option value="repair">🔧 Repair</option><option value="fuel">🛢️ Fuel</option>
        </select>
        <input id="fl-dept" data-t-ph="dept" placeholder="部門">
        <input id="fl-sup" placeholder="Supplier">
      </div>
      <div id="ledger-tbl"></div>
    </div>
  </div>

  <!-- 分類分析 -->
  <div class="exp-pane" id="pane-cat">
    <div class="ga-chart" style="margin-bottom:11px"><div class="ga-chart-t" data-t="chCatBar">分類金額</div><div class="ga-chart-box" style="height:300px"><canvas id="ch-catbar"></canvas></div></div>
    <div class="exp-sec"><div class="exp-sec-t">📁 <span data-t="catBreak">分類明細</span></div><div id="cat-tbl"></div></div>
  </div>

  <!-- 趨勢 -->
  <div class="exp-pane" id="pane-trend">
    <div class="ga-chart" style="margin-bottom:11px"><div class="ga-chart-t" data-t="chTrend">期間趨勢</div><div class="ga-chart-box" style="height:300px"><canvas id="ch-trend"></canvas></div></div>
    <div class="exp-sec"><div class="exp-sec-t">📈 <span data-t="trendList">期間彙總</span></div><div id="trend-tbl"></div></div>
  </div>

  <!-- 預算差異 -->
  <div class="exp-pane" id="pane-bgt">
    <div class="exp-sec">
      <div class="exp-sec-t">💰 <span data-t="bgtSet">月度預算設定</span>
        <span class="sp"><button class="ga-btn" onclick="saveBudgets()">💾 <span data-t="save">儲存</span></button></span>
      </div>
      <div id="bgt-tbl"></div>
    </div>
  </div>

  <!-- 新增費用 -->
  <div class="exp-pane" id="pane-add">
    <div class="exp-sec">
      <div class="exp-sec-t">➕ <span data-t="addManual">新增手動費用 Manual Expense</span></div>
      <div class="form-grid">
        <div><label data-t="date">日期</label><input type="date" id="a-date"></div>
        <div><label data-t="cat">類別</label><select id="a-cat"></select></div>
        <div><label data-t="item">項目</label><input id="a-item" placeholder="Item"></div>
        <div><label data-t="dept">部門</label><input id="a-dept" placeholder="Dept"></div>
        <div><label>Supplier</label><input id="a-sup" placeholder="Supplier"></div>
        <div><label data-t="qty">數量</label><input type="number" id="a-qty" step="0.01" placeholder="0"></div>
        <div><label data-t="estAmt">預估金額 Est.</label><input type="number" id="a-est" step="0.01" placeholder="0.00"></div>
        <div><label data-t="actAmt">實際金額 Actual</label><input type="number" id="a-amt" step="0.01" placeholder="0.00"></div>
        <div style="grid-column:1/-1"><label data-t="remark">備註</label><input id="a-note" placeholder="Remark"></div>
      </div>
      <button class="ga-btn primary" onclick="addManual()">➕ <span data-t="addBtn">新增並保存</span></button>
      <button class="ga-btn" onclick="expUpload()">⬆️☁ <span data-t="up">上傳</span></button>
    </div>
    <div class="exp-sec">
      <div class="exp-sec-t">✏️ <span data-t="editCat">類別管理</span></div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <input id="nc-label" placeholder="新類別名 e.g. Garden 園藝" style="flex:1;min-width:160px;border:1px solid var(--ga-line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit">
        <input id="nc-icon" placeholder="📌" maxlength="2" style="width:56px;text-align:center;border:1px solid var(--ga-line);border-radius:8px;padding:8px;font-size:15px">
        <button class="ga-btn" onclick="addCat()">➕ <span data-t="add">新增</span></button>
      </div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   AC-GA-EXP · Expense Center v2 — 逐筆交易資料庫（取代原硬寫矩陣）
   ════════════════════════════════════════════════════════════════ */
GA.addDict({
  zh:{ tabOv:'總覽',tabLedger:'明細帳',tabCat:'分類分析',tabTrend:'趨勢',tabBgt:'預算差異',tabAdd:'新增費用',
    chCat:'分類占比',chSrc:'來源模組',chCatBar:'分類金額',chTrend:'期間趨勢',topSpend:'主要支出 Top',
    catBreak:'分類明細',trendList:'期間彙總',bgtSet:'月度預算設定',addManual:'新增手動費用',editCat:'類別管理',
    addBtn:'新增並保存',est:'預估',act:'實際',budget:'預算',spent:'已花',remain:'剩餘',
    estAmt:'預估金額',actAmt:'實際金額',item:'項目',remark:'備註',cat:'類別',save:'儲存',add:'新增',
    kTotal:'本期支出',kYtd:'年度累計',kTxn:'交易筆數',kCat:'活躍類別',kAvg:'平均單筆',kEst:'預估vs實際',
    allCat:'全部類別',allSrc:'全部來源',delTxn:'刪除此筆？' },
  en:{ tabOv:'Overview',tabLedger:'Ledger',tabCat:'Category',tabTrend:'Trend',tabBgt:'Budget',tabAdd:'Add',
    chCat:'By Category',chSrc:'By Source',chCatBar:'Category Amount',chTrend:'Period Trend',topSpend:'Top Spend',
    catBreak:'Category Detail',trendList:'Period Summary',bgtSet:'Monthly Budget',addManual:'Add Manual Expense',editCat:'Category Manager',
    addBtn:'Add & Save',est:'Est.',act:'Actual',budget:'Budget',spent:'Spent',remain:'Remain',
    estAmt:'Estimated',actAmt:'Actual',item:'Item',remark:'Remark',cat:'Category',save:'Save',add:'Add',
    kTotal:'Period Spend',kYtd:'YTD Total',kTxn:'Transactions',kCat:'Active Cats',kAvg:'Avg / txn',kEst:'Est vs Actual',
    allCat:'All Categories',allSrc:'All Sources',delTxn:'Delete this record?' },
  km:{ tabOv:'ទិដ្ឋភាព',tabLedger:'បញ្ជី',tabCat:'ប្រភេទ',tabTrend:'និន្នាការ',tabBgt:'ថវិកា',tabAdd:'បន្ថែម',
    chCat:'តាមប្រភេទ',chSrc:'តាមប្រភព',chCatBar:'ចំនួនតាមប្រភេទ',chTrend:'និន្នាការ',topSpend:'ចំណាយច្រើន',
    catBreak:'លម្អិតប្រភេទ',trendList:'សង្ខេប',bgtSet:'ថវិកាប្រចាំខែ',addManual:'បន្ថែមចំណាយ',editCat:'គ្រប់គ្រងប្រភេទ',
    addBtn:'បន្ថែម',est:'ប៉ាន់',act:'ជាក់ស្តែង',budget:'ថវិកា',spent:'បានចាយ',remain:'នៅសល់',
    estAmt:'ប៉ាន់ស្មាន',actAmt:'ជាក់ស្តែង',item:'ធាតុ',remark:'ចំណាំ',cat:'ប្រភេទ',save:'រក្សាទុក',add:'បន្ថែម',
    kTotal:'ចំណាយ',kYtd:'សរុបឆ្នាំ',kTxn:'ប្រតិបត្តិការ',kCat:'ប្រភេទសកម្ម',kAvg:'មធ្យម',kEst:'ប៉ាន់vsជាក់',
    allCat:'ប្រភេទទាំងអស់',allSrc:'ប្រភពទាំងអស់',delTxn:'លុបកំណត់ត្រានេះ?' }
});

var CATMETA = {}, txns = [], budgets = {};
var pc, ledgerTbl, catTbl, trendTbl;
var LS_TXN = 'ac_ga_exp_txns_v2', LS_CAT = 'ac_ga_exp_cats_v2', LS_BGT = 'vrt26b';

function catLabel(k){ return (CATMETA[k] && CATMETA[k].label) || k; }
function catIcon(k){ return (CATMETA[k] && CATMETA[k].icon) || '📌'; }
function amt(r){ return GA.num(r.amount || r.estAmount || 0); }

function loadData(){
  try{ CATMETA = JSON.parse(localStorage.getItem(LS_CAT)) || null; }catch(e){ CATMETA=null; }
  if(!CATMETA) CATMETA = JSON.parse(JSON.stringify((window.EXP_SEED&&EXP_SEED.categories)||{}));
  var saved=null;
  try{ saved = JSON.parse(localStorage.getItem(LS_TXN)); }catch(e){}
  if(saved && saved.length){ txns = saved; }
  else {
    txns = ((window.EXP_SEED&&EXP_SEED.transactions)||[]).map(function(r){
      var rec = { date:r.date, category:r.category, item:r.item, spec:r.spec||'',
        qty:GA.num(r.qty), unit:r.unit||'', supplier:r.supplier||'', dept:r.dept||'',
        amount:GA.num(r.amount), estAmount:GA.num(r.amount), purpose:r.purpose||'',
        consumption:GA.num(r.consumption), consUnit:r.consUnit||'',
        sourceModule:'seed', status:'approved' };
      GA.stamp(rec,{source:'seed',prefix:'exp'});
      rec._fp = GA.smartImport.fingerprintOf('expense',rec);
      return rec;
    });
    saveTxns(true);
  }
  try{ budgets = JSON.parse(localStorage.getItem(LS_BGT)) || {}; }catch(e){ budgets={}; }
}
function saveTxns(silent){ try{ localStorage.setItem(LS_TXN, JSON.stringify(txns)); }catch(e){ if(!silent)GA.toast('本機儲存失敗','err'); } }
function saveCats(){ try{ localStorage.setItem(LS_CAT, JSON.stringify(CATMETA)); }catch(e){} }

function periodTxns(){ var st=pc.state(); return txns.filter(function(r){ return GA.inPeriod(r.date, st.key, st.type); }); }

function expTab(p){
  document.querySelectorAll('.exp-tab').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-p')===p); });
  document.querySelectorAll('.exp-pane').forEach(function(x){ x.classList.toggle('on', x.id==='pane-'+p); });
  render();
}
function render(){
  var on = document.querySelector('.exp-tab.on').getAttribute('data-p');
  if(on==='ov') renderOv();
  else if(on==='ledger') renderLedger();
  else if(on==='cat') renderCat();
  else if(on==='trend') renderTrend();
  else if(on==='bgt') renderBudget();
  else if(on==='add') renderAdd();
}

function renderOv(){
  var rows = periodTxns();
  var total = rows.reduce(function(a,r){ return a+amt(r); },0);
  var ytd = txns.reduce(function(a,r){return a+amt(r);},0);
  var byCat = {}; rows.forEach(function(r){ byCat[r.category]=(byCat[r.category]||0)+amt(r); });
  var activeCats = Object.keys(byCat).filter(function(k){return byCat[k]>0;}).length;
  var est = rows.reduce(function(a,r){return a+GA.num(r.estAmount);},0);
  var act = rows.reduce(function(a,r){return a+GA.num(r.amount);},0);

  var kpis=[
    {l:'kTotal',v:GA.money(total),s:rows.length+' '+GA.T('records'),c:'var(--ga-sky)'},
    {l:'kYtd',v:GA.money(ytd),s:'YTD',c:'var(--ga-ind)'},
    {l:'kTxn',v:rows.length,s:GA.T('kTxn'),c:'var(--ga-ok)'},
    {l:'kCat',v:activeCats,s:GA.T('kCat'),c:'var(--ga-warn)'},
    {l:'kAvg',v:GA.money(rows.length?total/rows.length:0),s:GA.T('kAvg'),c:'#8b5cf6'},
    {l:'kEst',v:(est?Math.round((act-est)/est*100):0)+'%',s:GA.T('est')+' '+GA.money(est),c:'var(--ga-bad)'}
  ];
  document.getElementById('exp-kpis').innerHTML = kpis.map(function(k){
    return '<div class="ga-kpi" style="--kc:'+k.c+'"><div class="ga-kpi-l">'+GA.T(k.l)+'</div>'+
      '<div class="ga-kpi-v">'+k.v+'</div><div class="ga-kpi-s">'+GA.esc(k.s)+'</div></div>';
  }).join('');

  var cats = Object.keys(byCat).filter(function(k){return byCat[k]>0;}).sort(function(a,b){return byCat[b]-byCat[a];});
  GA.chart('ch-cat',{ type:'doughnut',
    data:{ labels:cats.map(function(k){return catIcon(k)+' '+catLabel(k);}),
      datasets:[{ data:cats.map(function(k){return Math.round(byCat[k]);}), backgroundColor:GA.PALETTE, borderWidth:1 }]},
    options:{ responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:10,font:{size:9}}}}}});

  var bySrc={}; rows.forEach(function(r){ var s=r.sourceModule||'manual'; bySrc[s]=(bySrc[s]||0)+amt(r); });
  var srcs=Object.keys(bySrc);
  GA.chart('ch-src',{ type:'bar',
    data:{ labels:srcs, datasets:[{ data:srcs.map(function(s){return Math.round(bySrc[s]);}), backgroundColor:GA.PALETTE, borderRadius:5 }]},
    options:{ responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,ticks:{font:{size:9}}},x:{ticks:{font:{size:9}}}}}});

  document.getElementById('ov-count').textContent = rows.length+' '+GA.T('records');
  var top = rows.slice().sort(function(a,b){return amt(b)-amt(a);}).slice(0,12);
  document.getElementById('ov-top').innerHTML = top.length ? tableHTML(top) :
    '<div class="ga-empty"><div class="ga-empty-i">📭</div><div>'+GA.T('noData')+'</div></div>';
}

function ledgerCols(){
  return [
    {k:'date',t:'date',label:'Date'},
    {k:'category',label:GA.T('cat'),html:function(r){return catIcon(r.category)+' '+GA.esc(catLabel(r.category));}},
    {k:'item',t:'item'},
    {k:'dept',t:'dept'},
    {k:'supplier',label:'Supplier'},
    {k:'qty',t:'qty',num:true},
    {k:'estAmount',label:GA.T('est'),num:true,html:function(r){return r.estAmount?GA.money(r.estAmount,2):'—';}},
    {k:'amount',label:GA.T('act'),num:true,html:function(r){return GA.money(r.amount,2);}},
    {k:'sourceModule',label:'Src',html:function(r){
      var m={seed:'🗂️',manual:'✍️',excel:'📥',po:'📋',repair:'🔧',fuel:'🛢️'};
      return (m[r.sourceModule]||'✍️')+' '+GA.esc(r.sourceModule||'manual');}},
    {k:'_del',label:'',html:function(r){return '<button class="ga-btn" style="padding:2px 8px" onclick="delTxn(\''+r.recordId+'\')">🗑</button>';}}
  ];
}
function tableHTML(rows){
  var cols=ledgerCols();
  return '<div class="ga-tbl-scroll"><table class="ga-tbl"><thead><tr>'+
    cols.map(function(c){return '<th>'+GA.esc(c.t?GA.T(c.t):c.label||c.k)+'</th>';}).join('')+
    '</tr></thead><tbody>'+rows.map(function(r){
      return '<tr>'+cols.map(function(c){
        var v=c.html?c.html(r):GA.esc(r[c.k]);
        return '<td'+(c.num?' class="n"':'')+'>'+(v===''||v===undefined?'—':v)+'</td>';
      }).join('')+'</tr>';
    }).join('')+'</tbody></table></div>';
}
function renderLedger(){ ledgerTbl.data(applyFilters(periodTxns())); }
function applyFilters(rows){
  var fc=document.getElementById('fl-cat').value, fs=document.getElementById('fl-src').value,
      fd=document.getElementById('fl-dept').value.toLowerCase(), fsup=document.getElementById('fl-sup').value.toLowerCase();
  return rows.filter(function(r){
    if(fc && r.category!==fc) return false;
    if(fs && (r.sourceModule||'manual')!==fs) return false;
    if(fd && String(r.dept||'').toLowerCase().indexOf(fd)<0) return false;
    if(fsup && String(r.supplier||'').toLowerCase().indexOf(fsup)<0) return false;
    return true;
  });
}

function renderCat(){
  var rows=periodTxns(), byCat={};
  rows.forEach(function(r){ byCat[r.category]=(byCat[r.category]||0)+amt(r); });
  var cats=Object.keys(byCat).filter(function(k){return byCat[k]>0;}).sort(function(a,b){return byCat[b]-byCat[a];});
  GA.chart('ch-catbar',{ type:'bar',
    data:{ labels:cats.map(function(k){return catLabel(k);}),
      datasets:[{ label:GA.T('act'), data:cats.map(function(k){return Math.round(byCat[k]);}), backgroundColor:GA.PALETTE, borderRadius:5 }]},
    options:{ indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{beginAtZero:true,ticks:{font:{size:9}}},y:{ticks:{font:{size:10}}}}}});
  var total=cats.reduce(function(a,k){return a+byCat[k];},0);
  catTbl.data(cats.map(function(k){
    return { cat:catIcon(k)+' '+catLabel(k), amount:byCat[k],
             pct:total?(byCat[k]/total*100).toFixed(1)+'%':'0%',
             cnt:rows.filter(function(r){return r.category===k;}).length };
  }));
}

function renderTrend(){
  var st=pc.state();
  var keys=[], cur=GA.currentPeriod(st.type);
  for(var i=11;i>=0;i--) keys.push(GA.shiftPeriod(cur,st.type,-i));
  var sums=keys.map(function(k){
    return txns.filter(function(r){return GA.periodKey(r.date,st.type)===k;}).reduce(function(a,r){return a+amt(r);},0);
  });
  GA.chart('ch-trend',{ type:'line',
    data:{ labels:keys.map(function(k){return GA.periodLabel(k,st.type);}),
      datasets:[{ label:GA.T('act'), data:sums.map(function(v){return Math.round(v);}),
        borderColor:'#0284c7',backgroundColor:'rgba(2,132,199,.12)',fill:true,tension:.3,borderWidth:2 }]},
    options:{ responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,ticks:{font:{size:9}}},x:{ticks:{font:{size:9},maxRotation:45}}}}});
  trendTbl.data(keys.map(function(k,i){
    var rs=txns.filter(function(r){return GA.periodKey(r.date,st.type)===k;});
    return { period:GA.periodLabel(k,st.type), amount:sums[i], cnt:rs.length };
  }).reverse());
}

function renderBudget(){
  var rows=periodTxns(), byCat={};
  rows.forEach(function(r){ byCat[r.category]=(byCat[r.category]||0)+amt(r); });
  var cats=Object.keys(CATMETA).sort(function(a,b){return (byCat[b]||0)-(byCat[a]||0);});
  document.getElementById('bgt-tbl').innerHTML='<div class="ga-tbl-scroll"><table class="ga-tbl"><thead><tr>'+
    [GA.T('cat'),GA.T('budget'),GA.T('spent'),GA.T('remain'),'%'].map(function(h){return '<th>'+GA.esc(h)+'</th>';}).join('')+
    '</tr></thead><tbody>'+cats.map(function(k){
      var sp=byCat[k]||0, b=GA.num(budgets[k]);
      var rem=b-sp, pct=b?Math.round(sp/b*100):0, over=b&&sp>b;
      return '<tr><td>'+catIcon(k)+' '+GA.esc(catLabel(k))+'</td>'+
        '<td class="n"><input type="number" value="'+(b||'')+'" data-bk="'+k+'" style="width:90px;text-align:right;border:1px solid var(--ga-line);border-radius:5px;padding:3px 6px;font-family:var(--ga-mono);font-size:11px"></td>'+
        '<td class="n">'+GA.money(sp,2)+'</td>'+
        '<td class="n '+(over?'diff-pos':'diff-neg')+'">'+(b?GA.money(rem,2):'—')+'</td>'+
        '<td class="n">'+(b?'<span class="ga-badge '+(over?'bad':pct>80?'warn':'ok')+'">'+pct+'%</span>':'—')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function saveBudgets(){
  document.querySelectorAll('[data-bk]').forEach(function(inp){
    var v=GA.num(inp.value); if(v>0) budgets[inp.dataset.bk]=v; else delete budgets[inp.dataset.bk];
  });
  try{ localStorage.setItem(LS_BGT,JSON.stringify(budgets)); }catch(e){}
  GA.toast('💾 '+GA.T('save')+' OK'); renderBudget();
}

function renderAdd(){
  var sel=document.getElementById('a-cat');
  sel.innerHTML=Object.keys(CATMETA).map(function(k){return '<option value="'+k+'">'+catIcon(k)+' '+GA.esc(catLabel(k))+'</option>';}).join('');
  if(!document.getElementById('a-date').value) document.getElementById('a-date').value=GA.ymd(new Date());
}
function addManual(){
  var cat=document.getElementById('a-cat').value;
  var amtV=GA.num(document.getElementById('a-amt').value);
  var estV=GA.num(document.getElementById('a-est').value);
  if(!cat){ GA.toast('請選類別','err'); return; }
  if(!amtV && !estV){ GA.toast('請填金額','err'); return; }
  var rec={ date:document.getElementById('a-date').value||GA.ymd(new Date()),
    category:cat, item:document.getElementById('a-item').value.trim(),
    dept:document.getElementById('a-dept').value.trim(), supplier:document.getElementById('a-sup').value.trim(),
    qty:GA.num(document.getElementById('a-qty').value), estAmount:estV||amtV, amount:amtV||estV,
    purpose:document.getElementById('a-note').value.trim(), sourceModule:'manual', status:'approved' };
  GA.stamp(rec,{source:'online',prefix:'exp'});
  rec._fp=GA.smartImport.fingerprintOf('expense',rec);
  txns.push(rec); saveTxns();
  ['a-item','a-dept','a-sup','a-qty','a-est','a-amt','a-note'].forEach(function(id){document.getElementById(id).value='';});
  GA.toast('➕ OK'); fillFilters(); render();
}
function delTxn(id){
  GA.confirm(GA.T('delTxn')).then(function(ok){
    if(!ok) return;
    txns=txns.filter(function(r){return r.recordId!==id;});
    saveTxns(); GA.toast('🗑 OK'); render();
  });
}
function addCat(){
  var lbl=document.getElementById('nc-label').value.trim();
  if(!lbl){ GA.toast('請輸入類別名','err'); return; }
  var key='c_'+lbl.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,20)||('c_'+Date.now());
  if(CATMETA[key]){ GA.toast('類別已存在','err'); return; }
  CATMETA[key]={ icon:document.getElementById('nc-icon').value||'📌', label:lbl, type:'service' };
  saveCats();
  document.getElementById('nc-label').value=''; document.getElementById('nc-icon').value='';
  GA.toast('➕ OK'); fillFilters(); render();
}

function fillFilters(){
  var sel=document.getElementById('fl-cat'), cur=sel.value;
  sel.innerHTML='<option value="">— '+GA.T('allCat')+' —</option>'+
    Object.keys(CATMETA).map(function(k){return '<option value="'+k+'">'+catIcon(k)+' '+GA.esc(catLabel(k))+'</option>';}).join('');
  sel.value=cur;
  // 來源篩選 default option 三語
  var srcOpt=document.querySelector('#fl-src option[value=""]');
  if(srcOpt) srcOpt.textContent='— '+GA.T('allSrc')+' —';
}

function expUpload(){
  GA.cloud.set('sync');
  GA.gasPost('expenseSave',{ txns:txns, cats:CATMETA, budgets:budgets, schema:2 })
    .then(function(r){ GA.cloud.set('up',(r.data&&r.data.rows||txns.length)+' '+GA.T('records')); GA.toast('☁️ '+GA.T('up')+' OK'); })
    .catch(function(e){ GA.cloud.set('err',e.message); GA.toast(e.message,'err'); });
}
function expDownload(){
  GA.cloud.set('sync');
  GA.gasGet('expenseLoad').then(function(r){
    var d=r.data;
    if(!d){ GA.cloud.set('idle'); GA.toast('☁️ 雲端尚無資料'); return; }
    GA.confirm('以雲端資料覆蓋目前畫面？').then(function(ok){
      if(!ok){ GA.cloud.set('idle'); return; }
      if(d.txns){ txns=d.txns; saveTxns(); }
      if(d.cats){ CATMETA=d.cats; saveCats(); }
      if(d.budgets){ budgets=d.budgets; try{localStorage.setItem(LS_BGT,JSON.stringify(budgets));}catch(e){} }
      GA.cloud.set('down',r.ts); GA.toast('📥 '+GA.T('down')+' OK'); fillFilters(); render();
    });
  }).catch(function(e){ GA.cloud.set('err',e.message); GA.toast(e.message,'err'); });
}
function expExport(){
  var rows=applyFilters(periodTxns());
  if(!rows.length){ GA.toast(GA.T('noData'),'err'); return; }
  var hdr=['Date','Category','Item','Dept','Supplier','Qty','Unit','Est','Actual','Source','Purpose'];
  var aoa=[hdr].concat(rows.map(function(r){ return [r.date,catLabel(r.category),r.item,r.dept,r.supplier,r.qty,r.unit,r.estAmount,r.amount,r.sourceModule,r.purpose]; }));
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=hdr.map(function(_,i){return {wch:i<1?12:i===2?24:13};});
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Expense');
  XLSX.writeFile(wb,'AC_GA_EXP_Expense_'+GA.ymd(new Date())+'.xlsx');
}
function expImport(){
  GA.smartImport.openModal({
    allowSubmit:false,
    existing:function(type){ return type==='expense'?txns:[]; },
    onImport:function(payload){
      var add=(payload.expense||[]);
      add.forEach(function(r){
        if(!r.amount && r.estAmount) r.amount=r.estAmount;
        if(!r.category) r.category='other';
        if(!CATMETA[r.category]) CATMETA[r.category]={icon:'📌',label:r.category,type:'service'};
        r.sourceModule=r.sourceModule||'excel'; r.status='approved';
        txns.push(r);
      });
      saveTxns(); saveCats();
      GA.toast('📥 +'+add.length+' '+GA.T('records'));
      fillFilters(); render();
    }
  });
}
function expTelegram(){
  GA.telegram.open({
    module:'expense', canApprove:false,
    periods:function(type){ return txns.map(function(r){return GA.periodKey(r.date,type);}); },
    summary:function(s){
      var rows=txns.filter(function(r){return GA.inPeriod(r.date,s.period,s.ptype);});
      var total=rows.reduce(function(a,r){return a+amt(r);},0);
      var byCat={}; rows.forEach(function(r){byCat[r.category]=(byCat[r.category]||0)+amt(r);});
      var top=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];}).slice(0,5);
      var bySrc={}; rows.forEach(function(r){var m=r.sourceModule||'manual';bySrc[m]=(bySrc[m]||0)+amt(r);});
      return GA.telegram.buildSummary({
        icon:'💰', titleZh:'費用摘要', titleEn:'Expense Summary',
        lang:s.lang, period:GA.periodLabel(s.period,s.ptype),
        rows:[ {zh:'總支出',en:'Total',v:GA.money(total)},
          {zh:'交易筆數',en:'Records',v:rows.length},
          {zh:'活躍類別',en:'Categories',v:Object.keys(byCat).filter(function(k){return byCat[k]>0;}).length}, '-' ]
          .concat(top.map(function(k){return {zh:catLabel(k),en:catLabel(k),v:GA.money(byCat[k])};}))
          .concat(['-'])
          .concat(Object.keys(bySrc).map(function(m){return {zh:'來源·'+m,en:'src·'+m,v:GA.money(bySrc[m])};})),
        footer:'🕐 '+GA.ymd(new Date())
      });
    }
  });
}

/* 啟動 */
loadData();
GA.boot({ header:{ sel:'#ga-header', icon:'💰', name:'Expense Center 費用中心', version:'v2.0', cloudKey:'expense',
  onUpload:expUpload, onDownload:expDownload, onTelegram:expTelegram, onImport:expImport, onExport:expExport }});

pc = GA.periodControl('#exp-period',{ id:'expense', type:'month',
  dates:function(){ return txns.map(function(r){return r.date;}); }, onChange:function(){ render(); } });

ledgerTbl = GA.table('#ledger-tbl',{ size:50, sort:'date', cols:ledgerCols() });
catTbl = GA.table('#cat-tbl',{ size:50, cols:[
  {k:'cat',label:GA.T('cat')},
  {k:'amount',label:GA.T('act'),num:true,html:function(r){return GA.money(r.amount,2);}},
  {k:'pct',label:'%',num:true},
  {k:'cnt',label:GA.T('kTxn'),num:true}
]});
trendTbl = GA.table('#trend-tbl',{ size:20, cols:[
  {k:'period',label:GA.T('period')},
  {k:'amount',label:GA.T('act'),num:true,html:function(r){return GA.money(r.amount,2);}},
  {k:'cnt',label:GA.T('kTxn'),num:true}
]});

['fl-cat','fl-src','fl-dept','fl-sup'].forEach(function(id){
  document.getElementById(id).addEventListener('input',renderLedger);
});
fillFilters();
GA.on('lang',function(){ fillFilters(); render(); });
render();
</script>
</body>
</html>
