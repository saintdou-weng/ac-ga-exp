<script id="ga-exp-xlsb-utility-inline-v399">
(function(global){
'use strict';
var GA=global.GA;
if(!GA)return;
var V=GA.vrtParsers=GA.vrtParsers||{};
var baseExpense=typeof V.parseExpenseSheet==='function'?V.parseExpenseSheet:null;

function txt(v){return String(v===null||v===undefined?'':v).trim();}
function num(v){
  if(GA&&typeof GA.num==='function')return GA.num(v);
  var n=Number(String(v===null||v===undefined?'':v).replace(/,/g,''));
  return isFinite(n)?n:0;
}
function cell(v){return txt(v).toLowerCase().replace(/\s+/g,' ');}
function kindOf(sn){
  var s=String(sn||'').toLowerCase().replace(/[\s._\-]+/g,'');
  return /^electric(ity)?$/.test(s)?'electric':(/^water$/.test(s)?'water':'');
}
function monthNo(v){
  var k=cell(v).slice(0,3),m={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  return m[k]||0;
}
function titleYear(rows){
  rows=rows||[];
  for(var i=0;i<Math.min(6,rows.length);i++){
    var r=rows[i]||[];
    for(var c=0;c<r.length;c++){
      var sv=txt(r[c]),m=sv.match(/(?:^|[^0-9])(20\d{2})(?:[^0-9]|$)/);
      if(m)return +m[1];
    }
  }
  return 0;
}
function fileYear(meta){
  var m=String((meta&& (meta.fileName||meta.file))||'').match(/20\d{2}/);
  return m?+m[0]:0;
}
function utilityHeaderRow(rows){
  for(var i=0;i<Math.min(10,rows.length);i++){
    var cs=(rows[i]||[]).map(function(v){return cell(v).replace(/\s/g,'');}),score=0;
    if(cs.some(function(x){return /^old/.test(x);} ))score++;
    if(cs.some(function(x){return /^new/.test(x);} ))score++;
    if(cs.some(function(x){return /^consum/.test(x);} ))score++;
    if(cs.some(function(x){return /^unitprice/.test(x);} ))score++;
    if(cs.some(function(x){return /^amount/.test(x);} ))score+=2;
    if(score>=4)return i;
  }
  return -1;
}
function titleRowIndex(rows,hi){
  for(var r=Math.max(0,hi-3);r<hi;r++){
    var z=(rows[r]||[]).map(cell).join('|');
    if(/factory|staff house|dorm|housing/.test(z))return r;
  }
  return Math.max(0,hi-1);
}
function usdAmountCol(head,sub,rg){
  var c,h;
  for(c=rg.start;c<=rg.end;c++){
    h=cell(head[c]);
    if(/^amount/.test(h)&&/\$/.test(h))return c;
  }
  for(c=rg.start;c<=rg.end;c++){
    h=cell(head[c]);
    if(!/^amount/.test(h))continue;
    if(/riel|\(r\)/.test(h)||/riel/.test(cell(sub[c]))){
      for(var d=c+1;d<=Math.min(rg.end,c+3);d++)if(cell(sub[d])==='$')return d;
    }else if(cell(sub[c])==='$')return c;
  }
  for(c=rg.start;c<=rg.end;c++)if(cell(sub[c])==='$')return c;
  return -1;
}
function consumptionCol(head,rg){
  for(var c=rg.start;c<=rg.end;c++)if(/^consum/.test(cell(head[c])))return c;
  return -1;
}
function areaName(v){
  var s=cell(v);
  if(/factory/.test(s))return 'Factory';
  if(/expat/.test(s))return 'Expat staff house';
  if(/local/.test(s))return 'Local staff house';
  return txt(v)||'Utility';
}
function isTTL(row,rg){
  for(var c=rg.start;c<=rg.end;c++)if(/^(ttl|total)$/i.test(txt((row||[])[c])))return true;
  return false;
}
function directUtility(rows,meta){
  rows=rows||[];meta=meta||{};
  var sn=txt(meta.sheetName||meta.sheet),kind=kindOf(sn);
  if(!kind)return [];
  var fy=fileYear(meta),ty=titleYear(rows),year=ty||fy||new Date().getFullYear();
  if(fy&&ty&&ty<fy)return [];
  var hi=utilityHeaderRow(rows);
  if(hi<0)return [];
  var tri=titleRowIndex(rows,hi),titleRow=rows[tri]||[],head=rows[hi]||[],sub=rows[hi+1]||[];
  var maxCol=Math.max(titleRow.length,head.length,sub.length),titles=[];
  titleRow.forEach(function(v,c){
    var z=cell(v);
    if(/factory|staff house|dorm|housing/.test(z))titles.push({col:c,name:txt(v)});
  });
  if(!titles.length)return [];
  titles.sort(function(a,b){return a.col-b.col;});
  var blocks=titles.map(function(t,i){return {title:t,start:t.col,end:(titles[i+1]?titles[i+1].col:maxCol)-1};});
  var monCol=-1;
  for(var r0=hi+1;r0<Math.min(rows.length,hi+30)&&monCol<0;r0++){
    for(var c0=0;c0<Math.min(5,(rows[r0]||[]).length);c0++){
      if(monthNo((rows[r0]||[])[c0])){monCol=c0;break;}
    }
  }
  if(monCol<0)return [];
  var months=[];
  for(var r1=hi+1;r1<rows.length;r1++){
    var mm=monthNo((rows[r1]||[])[monCol]);
    if(mm)months.push({month:mm,start:r1});
  }
  months.forEach(function(m,i){m.end=(months[i+1]?months[i+1].start:rows.length)-1;});
  var out=[];
  blocks.forEach(function(b){
    var rg={start:b.start,end:b.end},ac=usdAmountCol(head,sub,rg),cc=consumptionCol(head,rg);
    if(ac<0)return;
    var area=areaName(b.title.name);
    months.forEach(function(m){
      var chosen=null,r,row,a;
      for(r=m.start;r<=m.end;r++){
        row=rows[r]||[];
        if(isTTL(row,rg)){
          a=num(row[ac]);
          if(a>0){chosen={row:r,amount:a};break;}
        }
      }
      if(!chosen){
        a=num((rows[m.start]||[])[ac]);
        if(a>0)chosen={row:m.start,amount:a};
      }
      if(!chosen){
        for(r=m.start;r<=m.end;r++){
          a=num((rows[r]||[])[ac]);
          if(a>0)chosen={row:r,amount:a};
        }
      }
      if(!chosen||!(chosen.amount>0))return;
      var cons=cc>=0?num((rows[m.start]||[])[cc]):0;
      if(!cons&&cc>=0)cons=num((rows[chosen.row]||[])[cc]);
      out.push({
        date:year+'-'+String(m.month).padStart(2,'0')+'-01',
        category:kind,
        categoryLabel:kind==='electric'?'Electricity':'Water',
        item:area,
        dept:area,
        amount:Math.round(chosen.amount*10000)/10000,
        estAmount:Math.round(chosen.amount*10000)/10000,
        qty:1,
        price:0,
        consumption:cons,
        consUnit:kind==='electric'?'KW':'m3',
        currency:'USD',
        purpose:area,
        sourceModule:'excel',
        _row:chosen.row+1,
        _utilityNet:true,
        _utilityInline:true
      });
    });
  });
  return out;
}
V.parseUtilityExpenseSheet=directUtility;
V.parseExpenseSheet=function(rows,meta){
  var sn=txt((meta&& (meta.sheetName||meta.sheet))||'');
  if(kindOf(sn))return directUtility(rows,meta);
  return baseExpense?baseExpense.call(V,rows,meta):[];
};
V.utilityInlineFix='3.9.10-self-contained-area-key';
global.__GA_EXP_UTILITY_DIRECT__=directUtility;
})(window);
</script>

function expRowsFromAny(v){
  if(Array.isArray(v))return v.slice();
  if(!v||typeof v!=='object')return [];
  var out=[];
  Object.keys(v).forEach(function(k){
    var p=v[k];
    if(Array.isArray(p))out=out.concat(p);
    else if(p&&typeof p==='object'){

  var s=text(v).toLowerCase().replace(/[\s._\-]+/g,'');
  return /^electric(ity)?$/.test(s)?'electric':(/^water$/.test(s)?'water':'');
}
function purgeImportedUtilityRowsForFile(src,fileName){
  if(src!=='general')return 0;
  var fb=sourceFileBase(fileName),removed=0;
  EXP3[src]=(EXP3[src]||[]).filter(function(r){
    var sameFile=sourceFileBase(r.sourceFile||'')===fb;
    var util=expenseUtilitySheetKey(r.sourceSheet||'');
    if(sameFile&&util){removed++;return false;}
    return true;
  });
  return removed;
}
function utilityImportDiagnostic(rows){
  var u=(rows||[]).filter(function(r){return expenseUtilitySheetKey(r.sourceSheet||'');});
  if(!u.length)return '';
  var latest=function(a){return a.slice().sort(function(x,y){return String(x.date).localeCompare(String(y.date));}).pop();};
  function part(kind,ico){var a=u.filter(function(r){return expenseUtilitySheetKey(r.sourceSheet)===kind;}),f=a.filter(function(r){return text(r.item)==='Factory';}),e=a.filter(function(r){return text(r.item)==='Expat staff house';}),l=a.filter(function(r){return text(r.item)==='Local staff house';}),x=latest(f),z=ico+' F '+f.length+' / Expat '+e.length+' / Local '+l.length;if(x)z+=' · '+String(x.date).slice(0,7)+' F '+money(value(x));return z;}
  return part('electric','⚡')+' · '+part('water','🚰');
}

    var total=added.repair+added.purchase+added.general,updatedTotal=updated.repair+updated.purchase+updated.general,changed=total+updatedTotal,stored=saveExp3();
    var diagnosticText=diagnostics.map(function(d){return d.file+' · '+d.sheets+' '+GA.T('expSheets')+' · '+d.records+' '+GA.T('expRows')+(d.utility?' · '+d.utility:'');}).join(' | ');

    activeTab=sources.length===1?sources[0]:'summary';window.expQuery='';
    var period=latest.slice(0,7),msg='📥 '+GA.T('expImported')+' '+total+' · '+GA.T('expUpdated')+' '+updatedTotal+' · '+GA.T('expSkipped')+' '+skipped;
    var status=diagnosticText+' · '+GA.T('expImported')+' '+total+' · '+GA.T('expUpdated')+' '+updatedTotal+' · '+GA.T('expSkipped')+' '+skipped+' · '+(stored?GA.T('expStored'):GA.T('expNotStored'));

    setExpenseImportStatus(stored?'ok':'err',status);if(period&&pc)pc.set('month',period);else render();GA.toast(msg);if(changed>0)scheduleExpenseAutoCloudSync('import');return{ok:true,added:total,updated:updatedTotal,changed:changed,skipped:skipped,latest:latest,recognized:recognized,stored:stored,diagnostics:diagnostics,duplicateCandidates:dupPending.length};

function expenseCategorySummary(rows){var by={};(rows||[]).forEach(function(r){ensureExpenseCategory(r,r._source);var c=r.expenseCategory;if(!by[c])by[c]={amount:0,count:0};by[c].amount+=value(r);by[c].count++;});var keys=Object.keys(by).sort(function(a,b){var au=(a==='electricity'||a==='water')?1:0,bu=(b==='electricity'||b==='water')?1:0;if(au!==bu)return bu-au;return by[b].amount-by[a].amount;});if(!keys.length)return'<div class="exp-empty">'+esc(GA.T('expNoData'))+'</div>';return'<div class="exp-table-wrap"><table class="exp-cat-summary"><thead><tr><th>'+esc(GA.T('expCategory'))+'</th><th>'+esc(GA.T('expRecords'))+'</th><th style="text-align:right">'+esc(GA.T('expTotal'))+'</th><th style="text-align:right">%</th></tr></thead><tbody>'+keys.map(function(k){var pct=sumRows(rows)?Math.round(by[k].amount/sumRows(rows)*1000)/10:0;return'<tr class="'+(k==='electricity'?'utility-electric':k==='water'?'utility-water':'')+'"><td><b>'+esc(expenseCatLabel(k,GA.lang))+'</b></td><td class="n">'+by[k].count+'</td><td class="n">'+money(by[k].amount)+'</td><td class="n">'+pct+'%</td></tr>';}).join('')+'</tbody></table></div>';}

function compactExpenseTable(rows,opt){opt=opt||{};var data=(rows||[]).slice();data.forEach(function(r){ensureExpenseCategory(r,r._source);});data.sort(function(a,b){return String(b.date).localeCompare(String(a.date))||value(b)-value(a);});if(opt.limit)data=data.slice(0,opt.limit);if(!data.length)return'<div class="exp-empty">'+esc(GA.T('expNoData'))+'</div>';return expensePeriodAlignedHtml()+'<div class="exp-table-wrap"><table class="exp-table compact"><thead><tr><th>'+esc(GA.T('date'))+'</th><th>'+esc(GA.T('expCategory'))+'</th><th>'+esc(GA.T('expItem'))+'</th><th style="text-align:right">'+esc(GA.T('expTotal'))+'</th><th>'+esc(expMsgText('數量×單價','Qty × Unit Price','បរិមាណ × តម្លៃឯកតា',GA.lang))+'</th><th>'+esc(GA.T('expSupplier'))+'</th><th>'+esc(GA.T('expPurpose'))+'</th><th>'+esc(expMsgText('操作','Actions','សកម្មភាព',GA.lang))+'</th></tr></thead><tbody>'+data.map(function(r){var src=r._source||opt.source||'legacy',id=encodeURIComponent(r.recordId||''),cat=r.expenseCategory||'other',qp=(r.qty?String(r.qty):'—')+' × '+(num(r.price)?money(r.price):'—');return'<tr class="'+expenseRowClass(r)+'"><td style="white-space:nowrap">'+esc(r.date||'—')+'</td><td><select class="exp-cat-select" onchange="quickExpenseCategory(\''+esc(src)+'\',\''+id+'\',this.value)">'+expenseCategoryOptions(cat,false)+'</select></td><td class="exp-item-cell">'+expenseUtilityBadge(r)+(expenseUtilityBadge(r)?'<br>':'')+'<b>'+esc(r.item||'—')+'</b>'+(r.spec?'<div class="exp-muted">'+esc(r.spec)+'</div>':'')+'</td><td class="exp-amount">'+money(value(r))+'</td><td style="white-space:nowrap">'+esc(qp)+'</td><td>'+esc(r.supplier||'—')+'</td><td class="exp-note-cell">'+esc(r.purpose||r.dept||'—')+'</td><td><div class="exp-mini-actions"><button onclick="openExpenseEdit(\''+esc(src)+'\',\''+id+'\')">✏️ '+esc(expMsgText('編輯','Edit','កែ',GA.lang))+'</button><button onclick="deleteExpenseRow(\''+esc(src)+'\',\''+id+'\')">🗑 '+esc(expMsgText('刪除','Delete','លុប',GA.lang))+'</button></div></td></tr>';}).join(' function quickExpenseCategory(src,idEnc,val){var id=decodeURIComponent(idEnc),f=expenseFind(src,id);if(!f)return;var test=Object.assign({},f.row,{expenseCategory:val||'other'}),dups=expenseDuplicateMatches(test,id);if(dups.length&&!window.confirm(expMsgText('⚠️ 變更分類後，本月會有 '+dups.length+' 筆相同分類／項目／金額。\n仍要儲存嗎？','⚠️ This category change creates '+dups.length+' same-month matching record(s).\nSave anyway?','⚠️ ការប្តូរប្រភេទនេះនឹងបង្កើតកំណត់ត្រាដូចគ្នា '+dups.length+' ក្នុងខែនេះ។\nនៅតែរក្សាទុកទេ?',GA.lang))){render();return;}f.row.expenseCategory=val||'other';f.row.updatedAt=new Date().toISOString();if(src==='legacy')saveTxns();else saveExp3();scheduleExpenseAutoCloudSync('category');GA.toast('💾 '+expMsgText('分類已儲存','Category saved','បានរក្សាទុកប្រភេទ',GA.lang));render();}
function openExpenseAdd(src){src=(src==='repair'||src==='purchase'||src==='general'||src==='legacy')?src:'general';openExpenseEdit(src,'');}
function openExpenseEdit(src,idEnc){var id=idEnc?decodeURIComponent(idEnc):'',f=id?expenseFind(src,id):null,r=f?Object.assign({},f.row):{date:GA.ymd(new Date()),expenseCategory:src==='repair'?'repair_maintenance':src==='purchase'?'purchasing_supplies':'other',qty:1,price:0,amount:0,item:'',supplier:'',purpose:'',dept:'',unit:'',inspector:''};ensureExpenseCategory(r,src);var ov=document.createElement('div');ov.className='ga-ov on';ov.innerHTML='<div class="ga-modal" style="max-width:650px"><div class="ga-modal-h"><b>'+(id?'✏️ '+esc(expMsgText('編輯費用','Edit Expense','កែចំណាយ',GA.lang)):'➕ '+esc(expMsgText('新增費用','Add Expense','បន្ថែមចំណាយ',GA.lang)))+'</b><span class="ga-modal-sub">'+esc(expSourceText(src,GA.lang))+'</span><button class="ga-x" data-close>&times;</button></div><div class="ga-modal-b"><div id="exp-edit-dup"></div><div class="exp-modal-grid"><div><label>'+esc(GA.T('date'))+'</label><input id="ee-date" type="date" value="'+esc(r.date||'')+'"></div><div><label>'+esc(GA.T('expCategory'))+'</label><select id="ee-cat">'+expenseCategoryOptions(r.expenseCategory,false)+'</select></div><div class="full"><label>'+esc(GA.T('expItem'))+'</label><input id="ee-item" value="'+esc(r.item||'')+'"></div><div><label>'+esc(GA.T('expDepartment'))+'</label><input id="ee-dept" value="'+esc(r.dept||'')+'"></div><div><label>'+esc(GA.T('expSupplier'))+'</label><input id="ee-sup" value="'+esc(r.supplier||'')+'"></div><div><label>'+esc(GA.T('expQty'))+'</label><input id="ee-qty" type="number" step="0.01" value="'+esc(r.qty||'')+'"></div><div><label>'+esc(GA.T('expUnit'))+'</label><input id="ee-unit" value="'+esc(r.unit||'')+'"></div><div><label>'+esc(GA.T('expPrice'))+'</label><input id="ee-price" type="number" step="0.01" value="'+esc(r.price||r.unitPrice||'')+'"></div><div><label>'+esc(GA.T('expTotal'))+'</label><input id="ee-amount" type="number" step="0.01" value="'+esc(value(r)||'')+'"></div><div><label>'+esc(GA.T('expInspector'))+'</label><input id="ee-inspector" value="'+esc(r.inspector||'')+'"></div><div class="full"><label>'+esc(GA.T('expPurpose'))+'</label><input id="ee-purpose" value="'+esc(r.purpose||'')+'"></div></div></div><div class="ga-modal-f"><button class="ga-btn" data-close>'+esc(GA.T('cancel'))+'</button><button class="ga-btn primary" id="ee-save">💾 '+esc(GA.T('save'))+'</button></div></div>';document.body.appendChild(ov);function close(){ov.remove();}ov.querySelectorAll('[data-close]').forEach(function(b){b.onclick=close;});ov.onclick=function(e){if(e.target===ov)close();};ov.querySelector('#ee-save').onclick=function(){var nr=f?Object.assign({},f.row):{};nr.date=ov.querySelector('#ee-date').value;nr.expenseCategory=ov.querySelector('#ee-cat').value;nr.item=text(ov.querySelector('#ee-item').value);nr.dept=text(ov.querySelector('#ee-dept').value);nr.supplier=text(ov.querySelector('#ee-sup').value);nr.qty=num(ov.querySelector('#ee-qty').value);nr.unit=text(ov.querySelector('#ee-unit').value);nr.price=num(ov.querySelector('#ee-price').value);nr.unitPrice=nr.price;nr.amount=num(ov.querySelector('#ee-amount').value)||(nr.qty&&nr.price?nr.qty*nr.price:0);nr.estAmount=nr.amount;nr.inspector=text(ov.querySelector('#ee-inspector').value);nr.purpose=text(ov.querySelector('#ee-purpose').value);nr._source=src;nr.sourceModule=nr.sourceModule||'manual';nr.status=nr.status||'approved';if(!nr.date||!nr.item||!nr.amount){GA.toast(expMsgText('日期、項目與金額為必填','Date, item and amount are required','ត្រូវបំពេញកាលបរិច្ឆេទ មុខទំនិញ និងចំនួន',GA.lang),'err');return;}var dups=expenseDuplicateMatches(nr,id);if(dups.length&&!window.confirm(expMsgText('⚠️ 本月已有相同分類／項目／金額 '+dups.length+' 筆。\n仍要儲存嗎？','⚠️ '+dups.length+' matching record(s) already exist this month.\nSave anyway?','⚠️ មាន '+dups.length+' កំណត់ត្រាដូចគ្នាក្នុងខែនេះ។\nនៅតែរក្សាទុកទេ?',GA.lang)))return;if(f){nr.recordId=f.row.recordId;nr._sourceKey=f.row._sourceKey;nr.createdAt=f.row.createdAt;nr.updatedAt=new Date().toISOString();f.list[f.index]=nr;}else{nr.recordId=GA.uid('exp');nr.createdAt=new Date().toISOString();nr.updatedAt=nr.createdAt;nr.categoryLabel=expenseCatDef(nr.expenseCategory).en;nr._fp=GA.fingerprint([src,nr.date,nr.expenseCategory,nr.item,nr.amount,nr.supplier,nr.recordId]);if(src==='legacy')txns.push(nr);else EXP3[src].push(nr);}if(src==='legacy')saveTxns();else saveExp3();scheduleExpenseAutoCloudSync(id?'edit':'add');GA.toast('💾 '+expMsgText('已儲存','Saved','បានរក្សាទុក',GA.lang));close();render();};}
function deleteExpenseRow(src,idEnc){var id=decodeURIComponent(idEnc),f=expenseFind(src,id);if(!f)return;if(!window.confirm(expMsgText('確定刪除此筆費用？','Delete this expense record?','លុបកំណត់ត្រាចំណាយនេះ?',GA.lang)))return;f.list.splice(f.index,1);if(src==='legacy')saveTxns();else saveExp3();scheduleExpenseAutoCloudSync('delete');GA.toast('🗑 '+expMsgText('已刪除','Deleted','បានលុប',GA.lang));render();}

actionBar=function(){var all=allSourceRows(),latest=expenseLatestPeriod(),hasCurrent=all.some(inCurrent),st=currentState(),src=(activeTab==='repair'||activeTab==='purchase'||activeTab==='general'||activeTab==='legacy')?activeTab:'general',hint='';if(all.length&&!hasCurrent)hint='<div class="exp-period-hint">⚠️ '+esc(expMsgText('目前期間沒有資料；已載入 '+all.length+' 筆，最新資料 '+(latest||'—')+'。','No data in the selected period; '+all.length+' records are loaded. Latest: '+(latest||'—')+'.','គ្មានទិន្នន័យក្នុងរយៈពេលដែលបានជ្រើស; បានផ្ទុក '+all.length+' កំណត់ត្រា។ ថ្មីបំផុត៖ '+(latest||'—')+'។',GA.lang))+' <button class="ga-btn" onclick="jumpExpenseLatest()">↗ '+esc(GA.T('expImportOpened'))+'</button></div>';return'<div class="exp-actions"><button class="ga-btn primary" onclick="expImport()">📥 '+esc(GA.T('expImport'))+'</button><button class="ga-btn" onclick="openExpenseAdd(\''+src+'\')">➕ '+esc(expMsgText('新增','Add','បន្ថែម',GA.lang))+'</button><button class="ga-btn" onclick="expExport()">📤 '+esc(GA.T('expExportCurrent'))+'</button><button class="ga-btn" onclick="expExportAll()">📊 '+esc(GA.T('expExportAll'))+'</button><button class="ga-btn" onclick="render()">↻ '+esc(GA.T('expRefresh'))+'</button></div><div class="exp-note">'+esc(GA.T('expImportHint'))+' · '+esc(GA.T('expCloudData'))+'<br><b>'+esc(expenseLocalSavedLabel())+'</b></div>'+hint+expenseImportStatusHtml();};
categoryBars=function(rows){var by={};(rows||[]).forEach(function(r){ensureExpenseCategory(r,r._source);var k=r.expenseCategory;by[k]=(by[k]||0)+value(r);});var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a];}).slice(0,12),max=keys.length?by[keys[0]]:1;if(!keys.length)return'<div class="exp-empty">'+esc(GA.T('expNoData'))+'</div>';return'<div class="exp-bars">'+keys.map(function(k){return'<div class="exp-bar-row"><span><b>'+esc(expenseCatLabel(k,GA.lang))+'</b></span><div class="exp-bar"><i style="width:'+Math.round(by[k]/max*100)+'%"></i></div><em>'+money(by[k])+'</em></div>';}).join('')+'</div>';};
expQuality=function(rows,prev){var q={supplier:0,purpose:0,price:0,future:0,zero:0,duplicate:0,sourceWarn:0},fp={};(rows||[]).forEach(function(r){ensureExpenseCategory(r,r._source);if(!text(r.supplier))q.supplier++;if(!text(r.purpose))q.purpose++;if(value(r)>0&&!num(r.price))q.price++;if(typeof GA.isFuture==='function'&&GA.isFuture(r.date))q.future++;if(value(r)<=0)q.zero++;if(text(r._warn))q.sourceWarn++;var k=expenseLogicalDuplicateKey(r);if(k){if(fp[k])q.duplicate++;fp[k]=1;}});q.current=sumRows(rows||[]);q.previous=sumRows(prev||[]);q.change=q.current-q.previous;q.changePct=q.previous?Math.round(q.change/q.previous*100):null;return q;};

function dedupeExpenseUtilityRows(){
  var a=EXP3.general||[],out=[],pos={};
  a.forEach(function(r){
    var uk=expenseUtilitySheetKey(r.sourceSheet||'');
    if(!uk){out.push(r);return;}
    var k=[sourceFileBase(r.sourceFile||''),uk,String(r.date||''),lower(r.item||r.dept||r.purpose||'')].join('|');
    if(pos[k]===undefined){pos[k]=out.length;out.push(r);return;}
    var old=out[pos[k]],take=!!r._utilityInline&&!old._utilityInline;
    if(!take&&!!r._utilityInline===!!old._utilityInline){var na=Date.parse(r.updatedAt||r.createdAt||0)||0,oa=Date.parse(old.updatedAt||old.createdAt||0)||0;take=na>=oa;}
    if(take)out[pos[k]]=r;
  });
  EXP3.general=out;
}

function expCloudUpload(opts){
  opts=opts||{};var url=GA.gasUrl&&GA.gasUrl();if(!url){return Promise.reject(new Error('GAS URL 尚未設定 / GAS URL is not configured'));}
  expSyncStatus(opts.silent?'背景同步中…':'智慧同步中…','sync');
  return GASmartSync.push({url:url,tool:EXP_SMART_TOOL,records:expSyncRows(),meta:expSyncMeta(),legacyToRecords:expLegacyToSync,autoMerge:true,onStatus:expSyncStatus,summary:{records:allRows().length,periods:expPeriodKeys('month').length}}).then(function(r){
    try{GA.saveCfg({sync_expense:new Date().toISOString()});}catch(e){}
    expSyncStatus(r&&r.skipped?'雲端已是最新':'上傳完成｜雲端資料已保留','up');
    if(!opts.silent)GA.toast(r&&r.skipped?'☁️ 已是最新':'☁️ 已上傳並保留雲端歷史','success');
    return r;
  }).catch(function(e){expSyncStatus(e.message,'err');if(!opts.silent)GA.toast('❌ 上傳失敗：'+e.message,'err');throw e;});
}
function expCloudDownload(opts){
  opts=opts||{};var url=GA.gasUrl&&GA.gasUrl();if(!url)return Promise.reject(new Error('GAS URL 尚未設定 / GAS URL is not configured'));
  expSyncStatus('智慧下載中…','sync');
  return GASmartSync.pull({url:url,tool:EXP_SMART_TOOL,localRecords:expSyncRows(),legacyToRecords:expLegacyToSync,apply:expApplySync,onStatus:expSyncStatus}).then(function(r){
    if(r&&r.noCloud){expSyncStatus('雲端尚無費用資料','idle');if(!opts.silent)GA.toast('☁️ 雲端尚無費用資料','warning');return r;}
    expSyncStatus('下載完成｜保留本機與雲端資料','down');if(!opts.silent)GA.toast('📥 已同步雲端資料（本機資料保留）','success');return r;
  }).catch(function(e){expSyncStatus(e.message,'err');if(!opts.silent)GA.toast('❌ 下載失敗：'+e.message,'err');throw e;});
}
function scheduleExpenseAutoCloudSync(reason){
  if(window.GAAutoSync){GAAutoSync.schedule('expense',reason||'change',{},250);return;}
  try{localStorage.setItem(EXP_SMART_PENDING,JSON.stringify({reason:reason||'change',at:new Date().toISOString()}));}catch(e){}
  clearTimeout(window._expSmartTimer);window._expSmartTimer=setTimeout(function(){expCloudUpload({silent:true}).then(function(){try{localStorage.removeItem(EXP_SMART_PENDING);}catch(e){}}).catch(function(){});},1200);
}
function expUpload(){return expCloudUpload({silent:false});}
function expDownload(){return expCloudDownload({silent:false});}
/* 不依賴每個模組重複改 modal：費用的摘要／核可成功後都自動排程背景同步。 */
(function(){var open=GA.telegram&&GA.telegram.open;if(!open)return;GA.telegram.open=function(opt){opt=opt||{};if(opt.module==='expense'){var oldS=opt.onSummarySent,oldA=opt.onApprovalSent;opt.onSummarySent=function(d,st){scheduleExpenseAutoCloudSync('telegram-summary');if(oldS)oldS(d,st);};opt.onApprovalSent=function(d,st){scheduleExpenseAutoCloudSync('telegram-approval');if(oldA)oldA(d,st);};}return open.call(this,opt);};})();
(function(){var f=document.getElementById('exp-file');if(f)f.addEventListener('change',function(){doExpenseImport(this.files);});})();
loadData();ensureExpenseModel();GA.boot({header:{sel:'#ga-header',icon:'💰',name:'Expense Center 費用中心',version:'v3.9.14',cloudKey:'expense',onUpload:expUpload,onDownload:expDownload,onTelegram:expTelegram,onImport:expImport,onExport:expExport}});
if(window.GAAutoSync){GAAutoSync.install({key:'expense',pull:expCloudDownload,push:expCloudUpload,canSync:function(){return !!(GA.gasUrl&&GA.gasUrl());},startDelay:120,anchor:'#ga-cloud'});}else{setTimeout(function(){try{expCloudDownload({silent:true}).catch(function(){})}catch(_){ }},120);try{if(localStorage.getItem(EXP_SMART_PENDING))setTimeout(function(){scheduleExpenseAutoCloudSync('retry');},250);}catch(e){}}
(function(){var tools=document.querySelector('.ga-hd-tools');if(tools){var b=document.createElement('button');b.className='ga-ico';b.title=GA.T('expManage');b.innerHTML='🗂️<span>'+GA.T('expManage')+'</span>';b.onclick=expDataPanel;var lang=tools.querySelector('.ga-lang');if(lang)tools.insertBefore(b,lang);else tools.appendChild(b);}})();
pc=GA.periodControl('#exp-period',{id:'expense3',type:'month',dates:function(){return allRows().map(function(r){return r.date;});},onChange:function(){saveExpenseUI();render();}});restoreExpenseUI();GA.on('lang',function(){render();});saveExpenseUI();render();
</script>
