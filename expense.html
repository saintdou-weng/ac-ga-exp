  .exp-wrap{max-width:1280px;margin:0 auto;padding:12px}

  .exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .exp-card{border:1px solid var(--ga-line);border-radius:10px;padding:12px;background:linear-gradient(135deg,#fff,#f8fbff)}
  .exp-card .lbl{font-size:11px;color:var(--ga-mut);font-weight:700}.exp-card .val{font-size:23px;font-weight:800;color:var(--ga-txt);font-family:var(--ga-mono);margin-top:5px}.exp-card .sub{font-size:11px;color:var(--ga-mut);margin-top:3px}
  .exp-compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.exp-compare .box{border:1px solid var(--ga-line);border-radius:9px;padding:10px}.exp-compare b{display:block;font-size:11px;color:var(--ga-mut);margin-bottom:4px}.exp-compare span{font-family:var(--ga-mono);font-weight:800}.diff-pos{color:var(--ga-bad)}.diff-neg{color:var(--ga-ok)}
  .exp-bars{display:grid;gap:7px}.exp-bar-row{display:grid;grid-template-columns:minmax(100px,180px) 1fr 90px;gap:8px;align-items:center;font-size:12px}.exp-bar{height:10px;border-radius:99px;background:#e8eef7;overflow:hidden}.exp-bar i{display:block;height:100%;background:linear-gradient(90deg,#1683d8,#22a06b);border-radius:99px}.exp-bar-row em{font-family:var(--ga-mono);font-style:normal;text-align:right}
  .exp-table-wrap{overflow:auto}.exp-table{width:100%;border-collapse:collapse;min-width:820px;font-size:12px}.exp-table th{background:#f4f7fb;color:var(--ga-txt2);font-size:11px;text-align:left;padding:9px 8px;border-bottom:2px solid var(--ga-line);white-space:nowrap}.exp-table td{padding:8px;border-bottom:1px solid #edf1f6;vertical-align:top}.exp-table td.n{text-align:right;font-family:var(--ga-mono);white-space:nowrap}.exp-table tr:hover td{background:#fbfdff}.exp-muted{color:var(--ga-mut)}.exp-empty{padding:28px;text-align:center;color:var(--ga-mut)}
  .exp-analysis{border:1px solid #cfe0ef;border-radius:9px;background:#f7fbff;padding:10px 12px;line-height:1.65;color:var(--ga-txt2)}.exp-analysis.has-warn{border-color:#f1d38a;background:#fffaf0}.exp-analysis small{display:block;color:var(--ga-mut);margin-top:7px}
  .exp-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.exp-form label{display:block;font-size:10px;font-weight:800;color:var(--ga-mut);margin-bottom:4px}.exp-form input,.exp-form select{width:100%;box-sizing:border-box;border:1px solid var(--ga-line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}.exp-form input:focus,.exp-form select:focus{outline:none;border-color:var(--ga-sky)}
  .exp-note{font-size:11px;color:var(--ga-mut);margin:7px 0 0}.exp-file{display:none}

/* 舊版雲端資料有時把來源存成「月份／分類物件」，新版則是逐筆陣列。

function expRowsFromAny(v){
  if(Array.isArray(v))return v.slice();
  if(!v||typeof v!=='object')return [];
  var out=[];
  Object.keys(v).forEach(function(k){
    var p=v[k];
    if(Array.isArray(p))out=out.concat(p);
    else if(p&&typeof p==='object'){
      var looksLikeRow=p.date||p.item||p.description||p.desc||p.amount!==undefined||p.total!==undefined||p.qty!==undefined||p.quantity!==undefined;
      out=out.concat(looksLikeRow?[p]:expRowsFromAny(p));
    }
  });
  return out;
}
function expRowsForBucket(v,src){
  return expRowsFromAny(v).map(function(r){return normalise(r,src,{file:r.sourceFile||'stored-data',sheet:r.sourceSheet||r.categoryLabel||src,row:r.sourceRow||r._row||0});}).filter(function(r){return r.date&&r.item;});
}
function expSourceBuckets(v){
  if(v&&v.exp3&&typeof v.exp3==='object')v=v.exp3;
  v=v&&typeof v==='object'?v:{};
  return {repair:expRowsForBucket(v.repair,'repair'),purchase:expRowsForBucket(v.purchase,'purchase'),general:expRowsForBucket(v.general,'general')};
}

function headRow(rows){
  var best=-1,score=0;

  return best;
}
function colIndex(headers,re){for(var i=0;i<headers.length;i++)if(re.test(headers[i]))return i;return -1;}

  var x=Object.assign({},r),a=num(x.amount||x.total||x.ttl||0),q=num(x.qty||x.quantity||0),p=num(x.price||x.unitPrice||x.unit_price||0);if(!a&&q&&p)a=q*p;if(!q&&a)q=1;

function parseDetailRows(rows,src,meta){
  var out=[],hi=headRow(rows);if(hi<0)return out;var h=(rows[hi]||[]).map(lower),dc=colIndex(h,/date|received|purchase|print/),ic=colIndex(h,/desc|description|item|part|name|issue|brand/),qc=colIndex(h,/qty|quantity/),uc=colIndex(h,/^unit$|unit/),pcx=colIndex(h,/unitprice|price|^up/),ac=colIndex(h,/amount|total|ttl/),sc=colIndex(h,/supplier|vendor/),rc=colIndex(h,/remark|purpose|location|note/);

function parseMonthlyRows(rows,src,meta){
  var out=[],year=rowYear(rows),hi=headRow(rows),h=hi>=0?(rows[hi]||[]).map(lower):[],mc=colIndex(h,/^month$|month/),ac=colIndex(h,/total|amount|ttl/);if(mc<0)mc=0;if(ac<0){for(var j=mc+1;j<Math.min((rows[hi]||[]).length,12);j++){if(/remark|note/.test(h[j]))continue;ac=j;break;}}if(hi<0)return out;

function parseWorkbook(wb,src,fileName){
  var out=[];if(!wb||!wb.SheetNames)return out;if(src==='general'&&(!GA.vrtParsers||typeof GA.vrtParsers.parseExpenseSheet!=='function'))throw new Error('General Expense parser v3.5 not loaded');wb.SheetNames.forEach(function(sheet){var sn=text(sheet),sl=sn.toLowerCase();if(/chart|supplier list|stop supply|staff house break down/.test(sl))return;var rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,raw:true,defval:''}),meta={file:fileName,fileName:fileName,sheet:sn,sheetName:sn};
    if(src==='purchase'){if(/^purchase/.test(sl))out=out.concat((GA.vrtParsers&&GA.vrtParsers.parsePurchase?GA.vrtParsers.parsePurchase(rows,meta):parseDetailRows(rows,src,meta)).map(function(r){return normalise(r,src,meta);}));return;}

function expQuality(rows,prev){
  var q={supplier:0,purpose:0,price:0,future:0,zero:0,duplicate:0,sourceWarn:0};
  var fp={};
  (rows||[]).forEach(function(r){
    if(!text(r.supplier))q.supplier++;
    if(!text(r.purpose))q.purpose++;
    if(value(r)>0&&!num(r.price))q.price++;
    if(typeof GA.isFuture==='function'&&GA.isFuture(r.date))q.future++;
    if(value(r)<=0)q.zero++;
    if(text(r._warn))q.sourceWarn++;
    var k=r._fp||[r.date,r.item,r.amount,r.sourceSheet].join('|');if(fp[k])q.duplicate++;fp[k]=1;
  });
  q.current=sumRows(rows||[]);q.previous=sumRows(prev||[]);q.change=q.current-q.previous;
  q.changePct=q.previous?Math.round(q.change/q.previous*100):null;
  return q;
}
function expQualityHtml(rows,prev){

  if(q.purpose)items.push('⚠️ '+esc(GA.T('expMissingPurpose'))+'：'+q.purpose+' '+esc(GA.T('expRows')));

  if(q.future)items.push('⚠️ '+esc(GA.T('expFuture'))+'：'+q.future+' '+esc(GA.T('expRows')));
  if(q.zero)items.push('⚠️ '+esc(GA.T('amount'))+' ≤ 0：'+q.zero+' '+esc(GA.T('expRows')));
  if(q.duplicate)items.push('⚠️ Duplicate records：'+q.duplicate+' '+esc(GA.T('expRows')));

}

function importFiles(files){
  var list=Array.prototype.slice.call(files||[]);if(!list.length)return Promise.resolve({ok:false,added:0});
  var added={repair:0,purchase:0,general:0},updated={repair:0,purchase:0,general:0},skipped=0,recognized=0,recognizedRows=[],diagnostics=[],recognizedSources={};
  setExpenseImportStatus('','⏳ '+GA.T('expImportReading')+'：'+list.map(function(f){return f.name;}).join(', '));render();
  return Promise.all(list.map(function(file){var src=classifyFile(file.name);return readWorkbook(file).then(function(wb){
    skipped+=collapseSourceDuplicates(src);var rs=parseWorkbook(wb,src,file.name),idx={};recognized+=rs.length;recognizedRows=recognizedRows.concat(rs);if(rs.length)recognizedSources[src]=1;
    diagnostics.push({file:file.name,sheets:(wb.SheetNames||[]).length,records:rs.length,source:src});
    EXP3[src].forEach(function(x,i){var k=sourceIdentity(x,src,{file:x.sourceFile,sheet:x.sourceSheet,row:x.sourceRow});if(k)idx[k]=i;});
    rs.forEach(function(x){var key=sourceIdentity(x,src,{file:x.sourceFile,sheet:x.sourceSheet,row:x.sourceRow}),pos=key!==''?idx[key]:undefined;if(pos!==undefined){var old=EXP3[src][pos];if(sameImportedRow(old,x)){skipped++;EXP3_IMPORT_STATS[src].skipped++;return;}x.recordId=old.recordId||x.recordId;x.createdAt=old.createdAt||x.createdAt;x.updatedAt=new Date().toISOString();EXP3[src][pos]=x;updated[src]++;EXP3_IMPORT_STATS[src].updated++;return;}EXP3[src].push(x);if(key)idx[key]=EXP3[src].length-1;added[src]++;EXP3_IMPORT_STATS[src].imported++;});
  });})).then(function(){
    var total=added.repair+added.purchase+added.general,updatedTotal=updated.repair+updated.purchase+updated.general,changed=total+updatedTotal,stored=saveExp3();
    var diagnosticText=diagnostics.map(function(d){return d.file+' · '+d.sheets+' '+GA.T('expSheets')+' · '+d.records+' '+GA.T('expRows');}).join(' | ');
    if(!recognized){var noRows='⚠️ '+GA.T('expImportNoRows')+' · '+diagnosticText;setExpenseImportStatus('err',noRows);GA.toast(noRows,'err');render();return{ok:false,added:0,updated:0,changed:0,skipped:0,diagnostics:diagnostics};}
    var sources=['repair','purchase','general'].filter(function(k){return recognizedSources[k];}),latest=recognizedRows.map(function(r){return String(r.date||'');}).filter(Boolean).sort().pop()||'';
    activeTab=sources.length===1?sources[0]:'summary';window.expQuery='';
    var period=latest.slice(0,7),msg='📥 '+GA.T('expImported')+' '+total+' · '+GA.T('expUpdated')+' '+updatedTotal+' · '+GA.T('expSkipped')+' '+skipped;
    var status=diagnosticText+' · '+GA.T('expImported')+' '+total+' · '+GA.T('expUpdated')+' '+updatedTotal+' · '+GA.T('expSkipped')+' '+skipped+' · '+(stored?GA.T('expStored'):GA.T('expNotStored'));
    if(period){msg+=' · '+GA.T('expImportOpened')+' '+GA.periodLabel(period,'month');status+=' · '+GA.T('expImportOpened')+' '+GA.periodLabel(period,'month');}
    setExpenseImportStatus(stored?'ok':'err',status);
    if(period&&pc)pc.set('month',period);else render();
    GA.toast(msg);return{ok:true,added:total,updated:updatedTotal,changed:changed,skipped:skipped,latest:latest,recognized:recognized,stored:stored,diagnostics:diagnostics};
  }).catch(function(e){var err='❌ Excel: '+(e&&e.message?e.message:String(e));setExpenseImportStatus('err',err);GA.toast(err,'err');render();return{ok:false,added:0,error:e};});
}

function expSyncStatus(msg,type){try{GA.cloud.mount('#ga-cloud');GA.cloud.set(type||'sync',msg||'');}catch(e){} }
function expCloudUpload(opts){
  opts=opts||{};var url=GA.gasUrl&&GA.gasUrl();if(!url){return Promise.reject(new Error('GAS URL 尚未設定 / GAS URL is not configured'));}
  expSyncStatus(opts.silent?'背景同步中…':'智慧同步中…','sync');
  return GASmartSync.push({url:url,tool:EXP_SMART_TOOL,records:expSyncRows(),meta:expSyncMeta(),legacyToRecords:expLegacyToSync,autoMerge:true,onStatus:expSyncStatus,summary:{records:allRows().length,periods:expPeriodKeys('month').length}}).then(function(r){
    try{GA.saveCfg({sync_expense:new Date().toISOString()});}catch(e){}
    expSyncStatus(r&&r.skipped?'雲端已是最新':'上傳完成｜雲端資料已保留','up');
    if(!opts.silent)GA.toast(r&&r.skipped?'☁️ 已是最新':'☁️ 已上傳並保留雲端歷史','success');
    return r;
  }).catch(function(e){expSyncStatus(e.message,'err');if(!opts.silent)GA.toast('❌ 上傳失敗：'+e.message,'err');throw e;});
}
function expCloudDownload(opts){
  opts=opts||{};var url=GA.gasUrl&&GA.gasUrl();if(!url)return Promise.reject(new Error('GAS URL 尚未設定 / GAS URL is not configured'));
  expSyncStatus('智慧下載中…','sync');
  return GASmartSync.pull({url:url,tool:EXP_SMART_TOOL,localRecords:expSyncRows(),legacyToRecords:expLegacyToSync,apply:expApplySync,onStatus:expSyncStatus}).then(function(r){
    if(r&&r.noCloud){expSyncStatus('雲端尚無費用資料','idle');if(!opts.silent)GA.toast('☁️ 雲端尚無費用資料','warning');return r;}
    expSyncStatus('下載完成｜保留本機與雲端資料','down');if(!opts.silent)GA.toast('📥 已同步雲端資料（本機資料保留）','success');return r;
  }).catch(function(e){expSyncStatus(e.message,'err');if(!opts.silent)GA.toast('❌ 下載失敗：'+e.message,'err');throw e;});
}
function scheduleExpenseAutoCloudSync(reason){
  try{localStorage.setItem(EXP_SMART_PENDING,JSON.stringify({reason:reason||'change',at:new Date().toISOString()}));}catch(e){}
  clearTimeout(window._expSmartTimer);window._expSmartTimer=setTimeout(function(){expCloudUpload({silent:true}).then(function(){try{localStorage.removeItem(EXP_SMART_PENDING);}catch(e){}}).catch(function(){});},1200);
}
function expUpload(){return expCloudUpload({silent:false});}
function expDownload(){return expCloudDownload({silent:false});}
var _expImportFilesLatest=importFiles;
function importFiles(files){return Promise.resolve(_expImportFilesLatest(files)).then(function(r){if(r&&r.ok&&r.changed>0)scheduleExpenseAutoCloudSync('import');return r;});}
var _expAddManualLatest=addManual;
function addManual(){var r=_expAddManualLatest();scheduleExpenseAutoCloudSync('manual');return r;}
var _expSaveBudgetLatest=saveBudgetInputs;
function saveBudgetInputs(){var r=_expSaveBudgetLatest();scheduleExpenseAutoCloudSync('budget');return r;}
/* 不依賴每個模組重複改 modal：費用的摘要／核可成功後都自動排程背景同步。 */
(function(){var open=GA.telegram&&GA.telegram.open;if(!open)return;GA.telegram.open=function(opt){opt=opt||{};if(opt.module==='expense'){var oldS=opt.onSummarySent,oldA=opt.onApprovalSent;opt.onSummarySent=function(d,st){scheduleExpenseAutoCloudSync('telegram-summary');if(oldS)oldS(d,st);};opt.onApprovalSent=function(d,st){scheduleExpenseAutoCloudSync('telegram-approval');if(oldA)oldA(d,st);};}return open.call(this,opt);};})();
(function(){var f=document.getElementById('exp-file');if(f)f.addEventListener('change',function(){importFiles(this.files);});})();
loadData();GA.boot({header:{sel:'#ga-header',icon:'💰',name:'Expense Center 費用中心',version:'v3.5',cloudKey:'expense',onUpload:expUpload,onDownload:expDownload,onTelegram:expTelegram,onImport:expImport,onExport:expExport}});
try{if(localStorage.getItem(EXP_SMART_PENDING))setTimeout(function(){scheduleExpenseAutoCloudSync('retry');},700);}catch(e){}
(function(){var tools=document.querySelector('.ga-hd-tools');if(tools){var b=document.createElement('button');b.className='ga-ico';b.title=GA.T('expManage');b.innerHTML='🗂️<span>'+GA.T('expManage')+'</span>';b.onclick=expDataPanel;var lang=tools.querySelector('.ga-lang');if(lang)tools.insertBefore(b,lang);else tools.appendChild(b);}})();
pc=GA.periodControl('#exp-period',{id:'expense3',type:'month',dates:function(){return allRows().map(function(r){return r.date;});},onChange:function(){render();}});GA.on('lang',function(){render();});render();
</script>
