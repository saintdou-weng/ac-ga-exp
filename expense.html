function esc(v){return GA.esc(v===null||v===undefined?'':v);}
function num(v){return GA.num(v);}
function money(v){return GA.money(num(v),2);}
function text(v){return String(v===null||v===undefined?'':v).trim();}
function lower(v){return text(v).toLowerCase().replace(/[\s_\-\.\/()（）'’`,：:]/g,'');}
function dateOf(v){var s=text(v),m=s.match(/^(\d{1,2})-(\d{1,2})--(20\d{2})$/);if(m)return m[3]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0');return GA.excelDate(v);}
function sourceLabel(k){return GA.T(SRC_META[k]?SRC_META[k].label:k);}
function amt(r){return num(r.amount||r.estAmount||0);}
function allSourceRows(){return ['repair','purchase','general'].reduce(function(a,k){return a.concat(EXP3[k]||[]);},[]);}
function allRows(){return allSourceRows().concat(txns.map(function(r){var x=Object.assign({},r);x._source='legacy';x.sourceModule=x.sourceModule||'manual';return x;}));}
function currentState(){return pc?pc.state():{type:'month',key:GA.currentPeriod('month')};}
function inCurrent(r){var s=currentState();return GA.inPeriod(r.date,s.key,s.type);}
function rowsFor(k){return (k==='summary'?allSourceRows():k==='legacy'?txns:(EXP3[k]||[])).filter(inCurrent);}
function value(r){return amt(r);}

function loadData(){
  try{CATMETA=JSON.parse(localStorage.getItem(LS_CAT))||null;}catch(e){CATMETA=null;}
  if(!CATMETA)CATMETA=JSON.parse(JSON.stringify((window.EXP_SEED&&EXP_SEED.categories)||{}));
  try{var t=JSON.parse(localStorage.getItem(LS_TXN));if(Array.isArray(t)&&t.length)txns=t;}catch(e){}
  if(!txns.length&&window.EXP_SEED){txns=EXP_SEED.transactions.map(function(r){var x=Object.assign({},r);x.amount=num(x.amount);x.estAmount=num(x.estAmount||x.amount);x.sourceModule=x.sourceModule||'seed';x.status=x.status||'approved';GA.stamp(x,{source:'seed',prefix:'exp'});x._fp=GA.fingerprint([x.date,x.category,x.item,x.amount]);return x;});saveTxns(true);}
  try{budgets=JSON.parse(localStorage.getItem(LS_BGT))||{};}catch(e){budgets={};}
  try{var x=JSON.parse(localStorage.getItem(LS_EXP3));if(x&&typeof x==='object'){['repair','purchase','general'].forEach(function(k){if(Array.isArray(x[k]))EXP3[k]=x[k];});}}catch(e){}
}
function saveTxns(silent){try{localStorage.setItem(LS_TXN,JSON.stringify(txns));}catch(e){if(!silent)GA.toast('Local save failed','err');}}
function saveExp3(){try{localStorage.setItem(LS_EXP3,JSON.stringify(EXP3));}catch(e){GA.toast('Local save failed','err');}}
function saveCats(){try{localStorage.setItem(LS_CAT,JSON.stringify(CATMETA));}catch(e){}}
function saveBudgets(){try{localStorage.setItem(LS_BGT,JSON.stringify(budgets));}catch(e){}}

  return best;
}
function colIndex(headers,re){for(var i=0;i<headers.length;i++)if(re.test(headers[i]))return i;return -1;}

function parseMonthlyRows(rows,src,meta){

function expQuality(rows,prev){
  var q={supplier:0,purpose:0,price:0,future:0,zero:0,duplicate:0};
  var fp={};
  (rows||[]).forEach(function(r){
    if(!text(r.supplier))q.supplier++;
    if(!text(r.purpose))q.purpose++;
    if(value(r)>0&&!num(r.price))q.price++;
    if(typeof GA.isFuture==='function'&&GA.isFuture(r.date))q.future++;
    if(value(r)<=0)q.zero++;
    var k=r._fp||[r.date,r.item,r.amount,r.sourceSheet].join('|');if(fp[k])q.duplicate++;fp[k]=1;
  });
  q.current=sumRows(rows||[]);q.previous=sumRows(prev||[]);q.change=q.current-q.previous;
  q.changePct=q.previous?Math.round(q.change/q.previous*100):null;
  return q;
}
